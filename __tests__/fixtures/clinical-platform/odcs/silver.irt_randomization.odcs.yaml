# ODCS v3.2.0 data contract for silver.irt_randomization. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/silver.irt_randomization"
name: Randomisations
version: "1.0.0"
status: active
domain: IRT
tags:
  - silver
  - restricted
  - personal-health-data
  - synthetic
description:
  purpose: "IRT randomisations. The arm is restricted to unblinded roles."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: irt_randomization
    name: irt_randomization
    physicalName: silver.irt_randomization
    physicalType: table
    logicalType: object
    description: "IRT randomisations. The arm is restricted to unblinded roles."
    dataGranularityDescription: "One row per randomisation."
    properties:
      - name: randomization_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Randomisation number."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: confidential
      - name: subject_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Subject id."
        required: true
        classification: confidential
      - name: study_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Protocol id."
        required: true
        classification: internal
      - name: site_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Site id."
        required: true
        classification: internal
      - name: randomized_at
        logicalType: timestamp
        physicalType: TIMESTAMPTZ
        description: "UTC time of randomisation."
        required: true
        classification: confidential
      - name: arm
        logicalType: string
        logicalTypeOptions:
          maxLength: 80
        physicalType: "VARCHAR(80)"
        description: "Assigned arm. Blinded consumers must not read it."
        required: true
        classification: restricted
      - name: source_system
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Source system the record came from."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: irt_randomization_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - randomization_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (randomization_id) identifies one row."
team:
  name: IRT
  members:
    - username: clinical-supply-lead
      name: "Clinical Supply Lead"
      role: owner
    - username: irt-data-steward
      name: "IRT Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 25
    unit: "y"
    driver: regulatory
    description: "Regulation (EU) No 536/2014, Article 58: the trial master file is archived for at least 25 years after the end of the trial."
customProperties:
  - property: dataClassification
    value: restricted
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - bronze.irt.randomizations
  - property: consumers
    value: []
