name: Issue Hygiene

# Report-first hygiene for new and edited issues. An open issue without an
# "acceptance" section gets the `needs-info` label and one comment that points
# at docs/how-to/issue-governance.md. The job never closes, reopens,
# prioritises or touches release holds.
#
# Until the repository variable ISSUE_HYGIENE_APPLY is "true", the job only
# logs what it would do. Issue titles and bodies are untrusted: the body is
# read with `gh` into a variable and matched with grep, and never interpolated
# into a `run:` block.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to check
        required: true
        type: number

permissions: {}

jobs:
  check-acceptance:
    name: Check acceptance section
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    concurrency:
      group: issue-hygiene-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      APPLY: ${{ vars.ISSUE_HYGIENE_APPLY }}
    steps:
      - name: Check the issue and act if allowed
        run: |
          set -euo pipefail
          marker='<!-- issue-hygiene:acceptance -->'
          json=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body,state,comments)

          if [ "$(jq -r .state <<<"$json")" != "OPEN" ]; then
            echo "Issue #$ISSUE_NUMBER is not open. No action."
            exit 0
          fi

          if jq -r .body <<<"$json" | grep -qi 'acceptance'; then
            echo "Issue #$ISSUE_NUMBER has an acceptance section. No action."
            exit 0
          fi

          if jq -r '.comments[].body' <<<"$json" | grep -qF "$marker"; then
            echo "Issue #$ISSUE_NUMBER was already reported. No action."
            exit 0
          fi

          if [ "$APPLY" != "true" ]; then
            echo "Dry run: would add needs-info and comment on #$ISSUE_NUMBER."
            echo "Set the repository variable ISSUE_HYGIENE_APPLY to true to apply."
            exit 0
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label needs-info

          body=$(cat <<EOF
          $marker
          This issue has no acceptance section. Add a checklist of observable results so that whoever picks it up can tell when it is done. The rules are in [docs/how-to/issue-governance.md](https://github.com/$REPO/blob/main/docs/how-to/issue-governance.md).

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"
