<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">deruiter.dev</title>
  <desc id="d">Banner: deruiter.dev, clinical data tools, logic studios and twelve arcade cabinets, most of it running in your browser. A small pipeline runs from CRF to SDTM to ADaM to tables.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0e11" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d0e11" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d0e11" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="14" fill="#0d0e11" stroke="#2a2d35"/>
  <rect x="1" y="1" width="1278" height="338" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="760" height="338" rx="14" fill="url(#fade)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <circle cx="64" cy="72" r="5" fill="#f59e0b"/>
    <text x="80" y="77" font-size="15" letter-spacing="2.5" fill="#f4f4f6" font-weight="700">FDERUITER</text>
    <text x="196" y="77" font-size="13" letter-spacing="1.5" fill="#94a3b8">/ SOFTWARE &amp; SYSTEMS</text>
  </g>

  <text x="58" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2.7" fill="#f4f4f6">deruiter<tspan fill="#f59e0b">.</tspan>dev</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#a1a1aa">
    <text x="62" y="214">Clinical data tools, logic studios and twelve arcade cabinets.</text>
    <text x="62" y="244">Most of it runs in your browser, so you can try it.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2">
    <rect x="62" y="272" width="132" height="28" rx="6" fill="#13151a" stroke="#2a2d35"/>
    <circle cx="78" cy="286" r="4" fill="#10b981"/>
    <text x="90" y="290" fill="#d4d4d8">IN-BROWSER</text>
    <rect x="204" y="272" width="160" height="28" rx="6" fill="#13151a" stroke="#2a2d35"/>
    <circle cx="220" cy="286" r="4" fill="#f59e0b"/>
    <text x="232" y="290" fill="#d4d4d8">SYNTHETIC DATA</text>
    <rect x="374" y="272" width="168" height="28" rx="6" fill="#13151a" stroke="#2a2d35"/>
    <circle cx="390" cy="286" r="4" fill="#94a3b8"/>
    <text x="402" y="290" fill="#d4d4d8">SHIPS SUNDAYS</text>
  </g>

  <!-- pipeline motif -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">
    <path d="M884 96 H1196" stroke="#3f3f46" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M884 96 H1040" stroke="#f59e0b" stroke-width="2"/>
    <g>
      <rect x="846" y="78" width="76" height="36" rx="8" fill="#13151a" stroke="#f59e0b"/>
      <text x="884" y="101" text-anchor="middle" fill="#f4f4f6">CRF</text>
      <rect x="950" y="78" width="80" height="36" rx="8" fill="#13151a" stroke="#f59e0b"/>
      <text x="990" y="101" text-anchor="middle" fill="#f4f4f6">SDTM</text>
      <rect x="1058" y="78" width="80" height="36" rx="8" fill="#13151a" stroke="#3f3f46"/>
      <text x="1098" y="101" text-anchor="middle" fill="#d4d4d8">ADaM</text>
      <rect x="1166" y="78" width="66" height="36" rx="8" fill="#13151a" stroke="#3f3f46"/>
      <text x="1199" y="101" text-anchor="middle" fill="#d4d4d8">TLF</text>
    </g>
    <text x="846" y="140" font-size="11" font-weight="400" fill="#71717a" letter-spacing="1.5">ONE FICTIONAL STUDY, TRACED END TO END</text>
  </g>

  <!-- tiny proof tree -->
  <g stroke="#3f3f46" stroke-width="1.5" fill="none">
    <path d="M960 222 L912 262 M960 222 L1008 262"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
    <rect x="924" y="196" width="72" height="30" rx="7" fill="#13151a" stroke="#10b981"/>
    <text x="960" y="216" text-anchor="middle" fill="#f4f4f6">P → Q</text>
    <rect x="884" y="258" width="56" height="28" rx="7" fill="#13151a" stroke="#3f3f46"/>
    <text x="912" y="277" text-anchor="middle" fill="#d4d4d8">P</text>
    <rect x="980" y="258" width="56" height="28" rx="7" fill="#13151a" stroke="#3f3f46"/>
    <text x="1008" y="277" text-anchor="middle" fill="#d4d4d8">Q</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#71717a">
    <text x="960" y="308" text-anchor="middle">PROOFS</text>
    <text x="1170" y="308" text-anchor="middle">ARCADE</text>
  </g>

  <!-- arcade d-pad + buttons -->
  <g transform="translate(1100 196)">
    <rect x="0" y="22" width="66" height="22" rx="4" fill="#13151a" stroke="#3f3f46"/>
    <rect x="22" y="0" width="22" height="66" rx="4" fill="#13151a" stroke="#3f3f46"/>
    <rect x="23" y="23" width="20" height="20" fill="#13151a"/>
    <circle cx="100" cy="42" r="12" fill="#13151a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="128" cy="24" r="12" fill="#13151a" stroke="#10b981" stroke-width="2"/>
  </g>
</svg>
