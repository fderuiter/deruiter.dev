name: Feature request
description: Propose a focused improvement to the portfolio or its tooling.
title: "feat: "
labels:
  - type:feature
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain whose problem this solves and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note simpler approaches, tradeoffs, or related issues.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results that show the work is done. Agents use these to know when to stop.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Initiative, epic or feature this belongs under, if known. Leave blank if unsure.
      placeholder: "#3173"
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: This request contains no credentials or private data.
          required: true
