name: Weekly Train

# ADR 0063 (Proposed): merges to `main` never deploy. Once a week this
# workflow cuts a versioned GitHub Release from green `main` and ships exactly
# that commit to Production through the Vercel Deploy Hook. Vercel builds,
# migrates and serves; this workflow never migrates or holds a Vercel token,
# and its own build exists only to browser-test the release commit. The hook
# URL is the only production-adjacent value GitHub holds, and it can only
# build `main`.
#
# Inert until the operator turns it on (#2889):
#   - scheduled runs exit unless the repository variable WEEKLY_TRAIN is "on";
#   - any run exits while an open issue carries the `release:hold` label;
#   - firing fails clearly while the secret VERCEL_DEPLOY_HOOK_MAIN is unset.
#
# Stages:
#   1. Select: live SHA from /api/version; candidate = `main` HEAD.
#   2. Gate: Merge Gate on the candidate must pass (wait while it runs), and
#      no destructive migration may sit between live and candidate.
#   3. Release candidate suite: build the candidate and run the full chromium
#      Playwright suite against it (#2536). PRs ran it before they merged, but
#      a squash merge makes a new commit that main push CI never browser-tests.
#   4. Version: next semantic version from the Conventional Commits since the
#      last `v*` tag; draft a GitHub Release with grouped notes.
#   5. Fire: re-check that HEAD is still the candidate, POST the hook.
#   6. Confirm: wait for /api/version to report the candidate.
#   7. Smoke test: run the synthetic probes against the live site (#2538).
#   8. Publish the Release, which creates the tag. A failure after firing
#      leaves the Release as a draft and opens a `release:hold` issue, which
#      pauses the next run until a person closes it.
#
# `dry_run` skips straight to the smoke test against whatever is live: it
# drafts nothing, fires nothing and ignores the switch and holds, so the
# probe path can be exercised before the train is switched on. `rc_only`
# runs stages 1 and 3 on main HEAD and stops: it ignores the switch, holds
# and the live commit, so the release candidate suite can be timed and
# trusted before the first real release.

on:
  schedule:
    # Sunday 7 PM Central Standard Time (8 PM during daylight saving time).
    # GitHub cron is UTC: 01:00 UTC Monday.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Ship even if the live site already runs main HEAD"
        type: boolean
        default: false
      version:
        description: "Override the computed version, e.g. 1.0.0 (blank = automatic)"
        type: string
        default: ""
      dry_run:
        description: "Only smoke-test the live site; draft and deploy nothing"
        type: boolean
        default: false
      rc_only:
        description: "Only browser-test main HEAD as a release candidate; draft and deploy nothing"
        type: boolean
        default: false

concurrency:
  group: weekly-train
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  issues: write

jobs:
  gate:
    name: Select and gate the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
      live: ${{ steps.select.outputs.live }}
      ship: ${{ steps.select.outputs.ship }}
      rc: ${{ steps.select.outputs.rc }}
      dry: ${{ steps.select.outputs.dry }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE: "https://deruiter.dev"
      MERGE_GATE: "Merge Gate (Required Checks Summary)"

    steps:
      - name: Select and gate
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.WEEKLY_TRAIN }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          RC_ONLY: ${{ inputs.rc_only }}
        run: |
          set -euo pipefail
          skip() {
            echo "Skipped: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: smoke-testing what $SITE serves now; nothing is drafted or deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "dry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RC_ONLY" != "true" ]; then
            if [ "$EVENT" = "schedule" ] && [ "$SWITCH" != "on" ]; then
              skip "the repository variable WEEKLY_TRAIN is not \"on\"."
            fi

            holds=$(gh issue list --state open --label "release:hold" --json number --jq '[.[].number] | map("#" + tostring) | join(", ")')
            if [ -n "$holds" ]; then
              skip "open release:hold issue(s) $holds."
            fi
          fi

          live=$(curl -fsS --retry 3 "$SITE/api/version" | jq -r '.sha')
          echo "live=$live" >> "$GITHUB_OUTPUT"

          # Wait up to 45 minutes for Merge Gate on main HEAD. If a merge lands
          # meanwhile, follow the new HEAD: its run is the one that will finish.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            candidate=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
            if [ "$candidate" = "$live" ] && [ "$FORCE" != "true" ] && [ "$RC_ONLY" != "true" ]; then
              skip "the live site already runs main HEAD ${candidate:0:7}."
            fi
            run=$(gh api -X GET "repos/$GH_REPO/commits/$candidate/check-runs" \
              -f check_name="$MERGE_GATE" -f filter=latest \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") break ;;
              # A newer merge cancels this run; the next pass reads the new HEAD.
              "completed cancelled") ;;
              "completed "*)
                echo "::error::Merge Gate on main HEAD ${candidate:0:7} finished as '${run#completed }'; nothing shipped this week."
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Merge Gate on main HEAD ${candidate:0:7} did not finish within 45 minutes; nothing shipped this week."
              exit 1
            fi
            sleep 60
          done

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "rc=true" >> "$GITHUB_OUTPUT"
          if [ "$RC_ONLY" = "true" ]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "Release candidate suite only: \`$candidate\`; nothing is drafted or deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
            echo "Candidate: \`$candidate\` (live: \`$live\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout Code
        if: steps.select.outputs.ship == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: steps.select.outputs.ship == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # ADR 0049 applies migrations during the Production build, before the
      # site switches over, so a destructive statement would reach the live
      # database ahead of any check. Hold the train and ship it by hand (#2537).
      - name: Hold on destructive migrations
        if: steps.select.outputs.ship == 'true'
        env:
          LIVE: ${{ steps.select.outputs.live }}
          CANDIDATE: ${{ steps.select.outputs.candidate }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          report=$(node --no-warnings scripts/check-migration-safety.ts "$LIVE" "$CANDIDATE")
          status=$?
          echo "$report"
          if [ "$status" -eq 1 ]; then
            body=$(printf 'The weekly train found destructive migrations between the live commit and `%s`, so nothing shipped.\n\n```\n%s\n```\n\nRun: %s\n\nReview them, release by hand from the Vercel Dashboard, then close this issue so the train resumes.\n' "$CANDIDATE" "$report" "$RUN_URL")
            gh issue create --title "ops(release): destructive migrations hold the weekly train" \
              --label "release:hold" --assignee "$OWNER" --body "$body"
            exit 1
          fi
          exit "$status"

  # #2536: PRs pass the browser suite before they merge, but a squash merge
  # makes a new commit, and main push CI skips the browser jobs. Build the
  # release candidate itself and run the full chromium suite against it before
  # anything ships. These jobs mirror `build` and `heavy-gate` in ci.yml (same
  # build entrypoint, bundle budgets, image and shards) rather than calling
  # ci.yml, whose concurrency group and Merge Gate belong to PRs and pushes.
  # They run untrusted-by-default package code, so they get a read-only token.
  rc-build:
    name: Release candidate build (bundle budgets)
    needs: gate
    if: needs.gate.outputs.rc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.candidate }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx --no-install tsx scripts/generate-theme.ts
          npx --no-install prisma generate

      # Restore only, from the key cache-warm saves on every main push.
      - name: Next.js Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', '*.config.*') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      # The same entrypoint Vercel runs, under Vercel's build machine limits
      # (scripts/vercel-shaped-build.sh), so a candidate that would run out of
      # memory on Vercel fails here, before the Deploy Hook fires. Off Vercel,
      # scripts/build.js never migrates, and the dead-end DATABASE_URL makes
      # static generation fall back exactly as ci.yml's `build` job does.
      - name: Build Production (Vercel-shaped, 2 cores and 8 GB)
        run: bash scripts/vercel-shaped-build.sh
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Verify Bundle Performance Budgets
        run: npm run analyze:bundle -- --strict

      - name: Upload Release Candidate Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-build
          path: |
            .next/
            !.next/cache/
            !**/.env*
            public/sw.js
            public/sw.js.map
            public/garmin-engine.js
            public/monkey-c-mayhem.js
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  rc-browser:
    name: Release candidate browser suite (chromium shard ${{ matrix.shard }}/3)
    needs: [gate, rc-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The Playwright image pinned by digest to the locked @playwright/test
    # (__tests__/ci-toolchain-pinning.test.ts checks every workflow).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.candidate }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx --no-install tsx scripts/generate-theme.ts
          npx --no-install prisma generate

      - name: Download Release Candidate Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-build

      - name: Run the Playwright suite (chromium shard)
        run: npx --no-install playwright test --project=chromium --shard=${{ matrix.shard }}/3 --reporter=github,blob
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"

      - name: Upload Playwright Blob Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-playwright-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  # Nothing shipped, so no release:hold: next week's candidate gets a fresh
  # suite. The issue makes sure a person sees the failure before then.
  rc-failed:
    name: Report a failed release candidate
    needs: [gate, rc-build, rc-browser]
    if: always() && needs.gate.outputs.ship == 'true' && (needs.rc-build.result == 'failure' || needs.rc-browser.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE: ${{ needs.gate.outputs.candidate }}
      BUILD: ${{ needs.rc-build.result }}
      BROWSER: ${{ needs.rc-browser.result }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          The weekly train stopped before deploying: the release candidate \`$CANDIDATE\` failed its own tests. Production is unchanged and no GitHub Release was drafted.

          - Release candidate build: $BUILD
          - Release candidate browser suite: $BROWSER
          - Run: $RUN_URL

          Fix the failure on \`main\`. The next weekly run tests the new HEAD; to release sooner, use Run workflow.
          EOF
          )
          gh issue create --title "ops(release): release candidate ${CANDIDATE:0:7} failed its browser suite" \
            --assignee "$OWNER" --body "$body"

  train:
    name: Weekly Train
    needs: [gate, rc-browser]
    if: always() && (needs.gate.outputs.dry == 'true' || (needs.gate.outputs.ship == 'true' && needs.rc-browser.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate: ${{ needs.gate.outputs.candidate }}
      tag: ${{ steps.version.outputs.tag }}
      fired: ${{ steps.fire.outputs.fired }}
      verified: ${{ steps.confirm.outputs.verified }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE: "https://deruiter.dev"

    steps:
      - name: Checkout Code
        if: needs.gate.outputs.ship == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Draft the versioned GitHub Release
        id: version
        if: needs.gate.outputs.ship == 'true'
        env:
          CANDIDATE: ${{ needs.gate.outputs.candidate }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"

          range="$CANDIDATE"
          if git rev-parse -q --verify "refs/tags/$last" > /dev/null; then
            range="$last..$CANDIDATE"
          fi
          subjects=$(git log --no-merges --format='%s' "$range")

          # Semantic Versioning from Conventional Commits. Before 1.0.0 a
          # breaking change bumps the minor version (SemVer item 4).
          if [ -n "$OVERRIDE" ]; then
            if ! [[ "$OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version override '$OVERRIDE' is not MAJOR.MINOR.PATCH."
              exit 1
            fi
            next="$OVERRIDE"
          elif grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects" \
            || git log --format='%b' "$range" | grep -q '^BREAKING CHANGE:'; then
            if [ "$major" -eq 0 ]; then next="0.$((minor + 1)).0"; else next="$((major + 1)).0.0"; fi
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$subjects"; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          tag="v$next"
          if [ "$(printf '%s\n%s\n' "$last" "$tag" | sort -V | tail -n 1)" != "$tag" ] || [ "$tag" = "$last" ]; then
            echo "::error::$tag is not newer than $last."
            exit 1
          fi

          section() {
            local lines
            lines=$(grep ${3:-} -E "$2" <<< "$subjects" | sed 's/^/- /' || true)
            if [ -n "$lines" ]; then printf '## %s\n\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section "Features" '^feat(\([^)]*\))?!?:'
            section "Fixes" '^fix(\([^)]*\))?!?:'
            section "Performance" '^perf(\([^)]*\))?!?:'
            section "Other changes" '^(feat|fix|perf)(\([^)]*\))?!?:' -v
            echo "Commit: \`$CANDIDATE\`"
            if [ "$last" != "v0.0.0" ]; then
              echo ""
              echo "Full changelog: https://github.com/$GH_REPO/compare/$last...$tag"
            fi
          } > "$RUNNER_TEMP/notes.md"

          # A failed week leaves its draft behind; replace it.
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo none)" = "true" ]; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --target "$CANDIDATE" \
            --title "$tag ($(date -u +%Y-%m-%d))" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Drafted $tag (previous: $last)." >> "$GITHUB_STEP_SUMMARY"

      - name: Fire the Vercel Deploy Hook
        id: fire
        if: needs.gate.outputs.ship == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
          CANDIDATE: ${{ needs.gate.outputs.candidate }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "::error::The secret VERCEL_DEPLOY_HOOK_MAIN is not set; see issue #2889."
            exit 1
          fi
          # The hook builds main HEAD at the moment it fires. Re-check that
          # HEAD is still the commit the Release was drafted for.
          head=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
          if [ "$head" != "$CANDIDATE" ]; then
            echo "::error::main moved to ${head:0:7} while the release candidate ${CANDIDATE:0:7} was being tested, and the hook can only build HEAD; nothing shipped. Run the workflow again."
            exit 1
          fi
          curl -fsS --retry 3 -X POST "$HOOK" -o /dev/null
          echo "fired=true" >> "$GITHUB_OUTPUT"
          echo "Deploy Hook fired for \`$CANDIDATE\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the release is live
        id: confirm
        if: steps.fire.outputs.fired == 'true' || needs.gate.outputs.dry == 'true'
        env:
          CANDIDATE: ${{ needs.gate.outputs.candidate }}
          DRY: ${{ needs.gate.outputs.dry }}
        run: |
          set -euo pipefail
          if [ "$DRY" = "true" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deadline=$(( $(date +%s) + 40 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sha=$(curl -fsS "$SITE/api/version" | jq -r '.sha' || true)
            if [ "$sha" = "$CANDIDATE" ]; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
              echo "Live: \`$sha\` on $SITE." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 60
          done
          echo "::error::$SITE did not report ${CANDIDATE:0:7} within 40 minutes of firing the hook."
          exit 1

      - name: Hold the train after a failed release
        if: failure() && steps.fire.outputs.fired == 'true'
        env:
          CANDIDATE: ${{ needs.gate.outputs.candidate }}
          LIVE: ${{ needs.gate.outputs.live }}
          TAG: ${{ steps.version.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          The weekly train fired the Deploy Hook for $TAG (\`$CANDIDATE\`), but $SITE did not report that commit within 40 minutes. The GitHub Release stays a draft.

          - Run: $RUN_URL
          - Live before the run: \`$LIVE\`

          Check the newest Production deployment in Vercel. If the site is broken, use **Instant Rollback** to the previous Production deployment. This issue carries \`release:hold\`, so the next weekly run skips until it is closed.
          EOF
          )
          gh issue create --title "ops(release): weekly train failed for $TAG" \
            --label "release:hold" --assignee "$OWNER" --body "$body"

  # The synthetic probes, against the release now serving deruiter.dev.
  # `!cancelled()` replaces the implicit success(), which fails whenever any
  # upstream job was skipped: in a dry run rc-build and rc-browser always are,
  # so without it the dry run skipped the very probes it exists to run (#3021).
  probe:
    name: Smoke-test the live site
    needs: train
    if: ${{ !cancelled() && needs.train.result == 'success' && needs.train.outputs.verified == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/synthetic-probes.yml
    with:
      target_url: "https://deruiter.dev"

  publish:
    name: Publish the GitHub Release
    needs: [train, probe]
    if: needs.train.outputs.fired == 'true' && needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.train.outputs.tag }}
      CANDIDATE: ${{ needs.train.outputs.candidate }}
    steps:
      - name: Publish the Release and its tag
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "Released $TAG (\`$CANDIDATE\`): live and smoke-tested." >> "$GITHUB_STEP_SUMMARY"

  hold-after-probe:
    name: Hold the train after a failed smoke test
    needs: [train, probe]
    if: always() && needs.train.outputs.fired == 'true' && needs.train.outputs.verified == 'true' && needs.probe.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.train.outputs.tag }}
      CANDIDATE: ${{ needs.train.outputs.candidate }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open a release:hold issue
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          $TAG (\`$CANDIDATE\`) is live on https://deruiter.dev, but the synthetic probes failed against it. The GitHub Release stays a draft.

          - Run: $RUN_URL (open the "Smoke-test the live site" job for the failing journey)

          If the site is broken, use **Instant Rollback** in Vercel to the previous Production deployment. This issue carries \`release:hold\`, so the next weekly run skips until it is closed.
          EOF
          )
          gh issue create --title "ops(release): smoke test failed after $TAG" \
            --label "release:hold" --assignee "$OWNER" --body "$body"
