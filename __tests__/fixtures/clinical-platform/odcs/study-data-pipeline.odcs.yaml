# ODCS v3.2.0 data contract for study-data-pipeline. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/study-data-pipeline"
name: "Study data: SDTM and ADaM"
version: "1.6.0"
status: active
domain: "Study data"
tags:
  - gold
  - restricted
  - personal-health-data
  - synthetic
description:
  purpose: "The Study Data Pipeline's SDTM and ADaM datasets for DEMO-301, published into the gold layer."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: TA
    name: TA
    physicalName: "m5/datasets/tabulations/sdtm/ta.json"
    physicalType: file
    logicalType: object
    description: "Trial Arms"
    dataGranularityDescription: "One record per planned element per arm"
    properties:
      - name: STUDYID
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Study Identifier"
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
      - name: DOMAIN
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Domain Abbreviation"
        required: true
        classification: internal
      - name: ARMCD
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Planned Arm Code"
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        classification: internal
      - name: ARM
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Description of Planned Arm"
        required: true
        classification: internal
      - name: TAETORD
        logicalType: integer
        physicalType: INTEGER
        description: "Element Order"
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        classification: internal
      - name: ETCD
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Element Code"
        required: true
        classification: internal
      - name: ELEMENT
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Description of Element"
        required: false
        classification: internal
      - name: EPOCH
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: Epoch
        required: true
        classification: internal
    quality:
      - id: TA_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - STUDYID
            - ARMCD
            - TAETORD
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (STUDYID, ARMCD, TAETORD) identifies one row."
  - id: TE
    name: TE
    physicalName: "m5/datasets/tabulations/sdtm/te.json"
    physicalType: file
    logicalType: object
    description: "Trial Elements"
    dataGranularityDescription: "One record per planned element"
    properties:
      - name: STUDYID
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Study Identifier"
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
      - name: DOMAIN
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Domain Abbreviation"
        required: true
        classification: internal
      - name: ETCD
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Element Code"
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        classification: internal
      - name: ELEMENT
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Description of Element"
        required: true
        classification: internal
      - name: TESTRL
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Rule for Start of Element"
        required: true
        classification: internal
      - name: TEENRL
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Rule for End of Element"
        required: false
        classification: internal
      - name: TEDUR
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Planned Duration of Element"
        required: false
        classification: internal
    quality:
      - id: TE_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - STUDYID
            - ETCD
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (STUDYID, ETCD) identifies one row."
  - id: TV
    name: TV
    physicalName: "m5/datasets/tabulations/sdtm/tv.json"
    physicalType: file
    logicalType: object
    description: "Trial Visits"
    dataGranularityDescription: "One record per planned visit"
    properties:
      - name: STUDYID
