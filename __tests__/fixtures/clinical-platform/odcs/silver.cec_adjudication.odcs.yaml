# ODCS v3.2.0 data contract for silver.cec_adjudication. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/silver.cec_adjudication"
name: "Event adjudications"
version: "1.0.0"
status: active
domain: "Clinical events committee"
tags:
  - silver
  - confidential
  - personal-health-data
  - synthetic
description:
  purpose: "Clinical events committee adjudications of site-reported events."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: cec_adjudication
    name: cec_adjudication
    physicalName: silver.cec_adjudication
    physicalType: table
    logicalType: object
    description: "Clinical events committee adjudications of site-reported events."
    dataGranularityDescription: "One row per adjudicated event."
    properties:
      - name: event_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Event id."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: confidential
      - name: study_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Protocol id."
        required: true
        classification: internal
      - name: site_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Site id."
        required: true
        classification: internal
      - name: subject_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Subject id."
        required: true
        classification: confidential
      - name: site_event_type
        logicalType: string
        logicalTypeOptions:
          maxLength: 80
        physicalType: "VARCHAR(80)"
        description: "Event type as reported by the site."
        required: true
        classification: confidential
      - name: site_device_related
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Whether the site judged the event device-related."
        required: true
        classification: confidential
      - name: occurred_on
        logicalType: date
        physicalType: DATE
        description: "Date the event occurred."
        required: true
        classification: confidential
      - name: reported_on
        logicalType: date
        physicalType: DATE
        description: "Date the site reported the event."
        required: true
        classification: confidential
      - name: adjudicated_on
        logicalType: date
        physicalType: DATE
        description: "Adjudication date, or null while pending."
        required: false
        classification: confidential
      - name: cec_event_type
        logicalType: string
        logicalTypeOptions:
          maxLength: 80
        physicalType: "VARCHAR(80)"
        description: "Event type as adjudicated."
        required: false
        classification: confidential
      - name: cec_device_related
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Whether the committee judged the event device-related."
        required: false
        classification: confidential
      - name: source_system
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Source system the record came from."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: cec_adjudication_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - event_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (event_id) identifies one row."
team:
  name: "Clinical events committee"
  members:
    - username: medical-safety-lead
      name: "Medical Safety Lead"
      role: owner
    - username: safety-data-steward
      name: "Safety Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 25
    unit: "y"
    driver: regulatory
    description: "Regulation (EU) No 536/2014, Article 58: the trial master file is archived for at least 25 years after the end of the trial."
customProperties:
  - property: dataClassification
    value: confidential
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - bronze.cec
  - property: consumers
    value:
      - "product:gold.fct_cec_adjudication"
