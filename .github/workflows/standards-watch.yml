name: Standards Watch

# #2992 step 5: once a week, read the newest version of every standard,
# NCI EVS terminology package and tool in the standards bill of materials
# (lib/clinical-standards/bom.ts) from where CDISC and NCI EVS publish them.
# When lib/clinical-standards/standards-latest.json changes, open a pull
# request that records it. Recording a newer version changes no pin: moving
# a pin is a controlled upgrade with an impact report (ADR 0065), made in
# its own pull request.
#
# Every source is public, so no CDISC Library key is used.
# scripts/open-bot-pr.sh opens the pull request, dispatches CI on its branch
# (a workflow's own pull requests start no workflows), and opens an issue
# instead when the repository does not let Actions open pull requests.

on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

concurrency:
  group: standards-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  watch:
    name: Standards Watch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Read Published Versions
        id: refresh
        continue-on-error: true
        run: |
          npx --no-install tsx scripts/standards-watch.ts refresh \
            --summary "$RUNNER_TEMP/standards-watch.md"

      - name: Publish Job Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/standards-watch.md" ]; then
            cat "$RUNNER_TEMP/standards-watch.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a Pull Request When a Version Moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          cp "$RUNNER_TEMP/standards-watch.md" "$body"
          scripts/open-bot-pr.sh chore/standards-watch- \
            "chore(standards): record newly published CDISC versions" \
            "$body" "Standards watch: newer CDISC versions published" \
            lib/clinical-standards/standards-latest.json

      - name: Fail When a Source Could Not Be Read
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::A standards source could not be read; see the job summary. Its committed value was kept."
          exit 1
