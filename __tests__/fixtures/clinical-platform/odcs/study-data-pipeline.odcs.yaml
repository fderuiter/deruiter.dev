      - name: TVENRL
        logicalType: string
        logicalTypeOptions:
          maxLength: 200
        physicalType: "VARCHAR(200)"
        description: "Rule for End of Visit"
        required: false
        classification: internal
    quality:
      - id: TV_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - STUDYID
            - VISITNUM
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (STUDYID, VISITNUM) identifies one row."
  - id: TI
    name: TI
