team:
  name: "Study data"
  members:
    - username: biostatistics-lead
      name: "Biostatistics Lead"
      role: owner
    - username: clinical-data-standards-steward
      name: "Clinical Data Standards Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 720
    unit: h
    driver: operational
    description: "The latest load is at most 720 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99.5
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 25
    unit: "y"
    driver: regulatory
    description: "Regulation (EU) No 536/2014, Article 58: the trial master file is archived for at least 25 years after the end of the trial."
customProperties:
  - property: dataClassification
    value: restricted
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - usdm.DEMO-301
  - property: consumers
    value: []
