name: Warehouse Load

# Loads the clinical platform's gold layer into the warehouse of record,
# checks that every table reads back with the fingerprint the plan expects,
# and writes `platform_meta.load_manifest`, which production builds read.
#
# The warehouse moved from Aurora DSQL (ADR 0070, #3007) to its own Neon
# project before the AWS Free plan closes (#3207, #3208). The gold layer goes
# into the schema `warehouse_gold`. The connection string is the repository
# secret WAREHOUSE_DATABASE_URL, for the warehouse project's role: never the
# site's DATABASE_URL, which this job does not read. `scripts/dsql-load.ts
# --target dsql` still loads DSQL by hand while the AWS account lasts.
#
# Manual only. Writes come from here and nowhere else, on `main`.

on:
  workflow_dispatch:

concurrency:
  group: warehouse-load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    name: Load gold layer into the warehouse
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}

    steps:
      - name: Check configuration
        run: |
          if [ -z "$WAREHOUSE_DATABASE_URL" ]; then
            echo "::error::Set the repository secret WAREHOUSE_DATABASE_URL to the warehouse Neon project's connection string (not the site's DATABASE_URL)."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Load, check parity and write the manifest
        run: |
          npx tsx scripts/dsql-load.ts \
            --target postgres \
            --summary "$GITHUB_STEP_SUMMARY" \
            --out "$RUNNER_TEMP/warehouse-load.json"
