# ODCS v3.2.0 data contract for gold.fct_spend_forecast. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/gold.fct_spend_forecast"
name: "Spend forecast facts"
version: "1.0.0"
status: active
domain: "Finance mart"
tags:
  - gold
  - confidential
  - synthetic
description:
  purpose: "Budget, actual spend and forecast at completion per study and vendor at the data cut. The forecast is the actual spend to date plus the planned budget still to come, scaled by the vendor's spend-to-budget ratio to date."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: fct_spend_forecast
    name: fct_spend_forecast
    physicalName: gold.fct_spend_forecast
    physicalType: table
    logicalType: object
    description: "Budget, actual spend and forecast at completion per study and vendor at the data cut. The forecast is the actual spend to date plus the planned budget still to come, scaled by the vendor's spend-to-budget ratio to date."
    dataGranularityDescription: "One row per study and vendor at the data cut."
    properties:
      - name: study_key
        logicalType: integer
        physicalType: INTEGER
        description: Study.
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
      - name: vendor_key
        logicalType: integer
        physicalType: INTEGER
        description: "Vendor; 0 for investigator grants."
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        classification: internal
      - name: as_of_date_key
        logicalType: integer
        physicalType: INTEGER
        description: "The data cut the forecast was made at."
        required: true
        classification: internal
      - name: budget_to_date_usd
        logicalType: integer
        physicalType: INTEGER
        description: "Budget for every quarter booked up to the data cut, whole US dollars."
        required: true
        classification: confidential
      - name: actual_to_date_usd
        logicalType: integer
        physicalType: INTEGER
        description: "Actual spend for every quarter booked up to the data cut, whole US dollars."
        required: true
        classification: confidential
      - name: remaining_budget_usd
        logicalType: integer
        physicalType: INTEGER
        description: "Planned budget for the quarters after the data cut, whole US dollars; 0 once the study's final report is in."
        required: true
        classification: confidential
      - name: budget_at_completion_usd
        logicalType: integer
        physicalType: INTEGER
        description: "Budget to date plus the remaining budget, whole US dollars."
        required: true
        classification: confidential
      - name: forecast_at_completion_usd
        logicalType: integer
        physicalType: INTEGER
        description: "Actual spend to date plus the remaining budget times actual over budget to date, rounded to whole US dollars; the remaining budget as planned when nothing was budgeted to date."
        required: true
        classification: confidential
      - name: variance_at_completion_usd
        logicalType: integer
        physicalType: INTEGER
        description: "Forecast minus budget at completion, whole US dollars; above 0 is a forecast overrun."
        required: true
        classification: confidential
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: fct_spend_forecast_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - study_key
            - vendor_key
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (study_key, vendor_key) identifies one row."
team:
  name: "Finance mart"
  members:
    - username: clinical-finance-lead
      name: "Clinical Finance Lead"
      role: owner
    - username: finance-data-steward
      name: "Finance Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 744
    unit: h
    driver: operational
    description: "The latest load is at most 744 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99.5
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 10
    unit: "y"
    driver: operational
    description: "Sponsor records policy for operational and derived data: a policy choice, not a regulatory minimum."
customProperties:
  - property: dataClassification
    value: confidential
  - property: personalHealthData
    value: false
  - property: synthetic
    value: true
  - property: upstream
    value:
      - gold.dim_study
      - gold.dim_vendor
      - silver.ctms_milestone
      - silver.finance_line
      - silver.finance_plan_line
  - property: consumers
    value:
      - "metric:budget_at_completion"
      - "metric:forecast_at_completion"
      - "metric:variance_at_completion"
      - "metric:forecast_vs_budget_at_completion"
