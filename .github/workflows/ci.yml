name: CI Pipeline

# ADR 0039 governs resource use in this file. The repository is currently
# public, so standard hosted runner minutes are free; bounded jobs, standard
# runner labels, and no duplicate gating runs remain reliability safeguards.
# The previous single `rigor-pipeline` job ran the full four-device Playwright
# matrix on every PR push AND again identically on the post-merge `main` push,
# which exhausted a month's allowance in one active dev day while the repository
# was private (see #733). This file splits fast checks from the expensive
# Playwright/Web-Vitals gate and scopes device-matrix breadth by trigger instead
# of running the same full suite twice per merge.
#
# CI-02 (#733 follow-up): the split above originally left `device-gate`'s
# targeted non-chromium coverage running only after a squash-merge landed on
# `main` (as `post-merge-device-smoke`), so a device-specific visual or touch
# regression could reach `main` before anything caught it. `device-gate` now
# runs on the pull request itself, alongside `heavy-gate`, so both the
# chromium suite and the targeted device coverage gate the merge — without
# reintroducing the four-device-on-every-push cost #733 eliminated. `main`
# push confirmation stays bounded to `fast-gate`/`security-gate` (a safety
# net for a direct push that bypasses PR review, per #732), and the full
# four-device matrix stays a one-click `workflow_dispatch` job
# (`cross-device-matrix`), not something that runs automatically anywhere.
#
# `merge-gate` is the single job branch protection (#732) should require: a
# job skipped via `if:` (e.g. `heavy-gate`/`device-gate` outside a PR) or
# skipped because a `needs:` predecessor failed reports a neutral/skipped
# conclusion, which a required-status-check rule treats as passing rather
# than blocking. `merge-gate` inspects every gating job's actual result
# with `if: always()` so a failed, cancelled, or skipped required
# predecessor can never leave the merge gate green. See
# docs/how-to/monitor-github-actions-minutes.md for the exact check name to
# require.
#
# CI-03: `merge-gate` itself used to carry `&& github.event_name !=
# 'workflow_dispatch'`, so a manual dispatch made the job skip entirely --
# which still posts a "skipped" conclusion under this exact required check
# name, and GitHub treats that as satisfied, not blocking (the same
# skip-is-a-pass gap the paragraph above closes for its predecessors, one
# level up). `merge-gate` now runs unconditionally and fails closed for any
# event it has no defined validation for (workflow_dispatch included), so
# this required check can never be satisfied by a skip, and a manual
# trigger can never manufacture a silent pass either.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      cross_device_matrix:
        description: "Run the full four-device Playwright matrix on demand"
        type: boolean
        default: false

# ADR 0039 (Correction 2026-09-18): `cancel-in-progress` was previously
# `${{ github.event_name == 'pull_request' }}`, i.e. false for `main` pushes.
# Consecutive merges therefore produced consecutive complete runs that never
# superseded one another — the fourteen `main` pushes on 2026-09-13 each got
# a full run, against a 2,000-minute monthly allowance. Only the newest state
# of `main` is worth verifying, and GitHub bills a cancelled job's elapsed
# time rather than its full cap, so superseding is strictly cheaper than
# letting a stale run finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, lint, docs/schema drift, unit tests and property fuzzing. This
  # is the ~10-11 minute slice of the old single job that never needed a
  # built app, so it runs first and gates the expensive jobs below via
  # `needs:` — a broken build fails here before any Playwright e2e minutes
  # are spent. It does install a cached Chromium for one Vitest suite that
  # renders the Mermaid corpus in a real browser (#954).
  fast-gate:
    name: Fast Gate (Typecheck, Lint, Docs, Unit, Fuzz)
    runs-on: ubuntu-latest
    # Provisional: the pre-split job's fast slice measured ~10.5 minutes.
    # Revisit once a clean run confirms the honest post-#731 runtime (#733
    # acceptance criterion) rather than guessing further.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # #954: `__tests__/mermaid-corpus.test.ts` renders the Mermaid corpus in
      # a real Chromium (validateCorpus -> launchChromiumWithFallback), and it
      # runs here under `npm run test:ci`. Without a browser the job failed on
      # every PR and on `main`. This mirrors the Heavy Gate's cached install and
      # shares its branch-scoped cache key, so a warm cache costs only the
      # host-dependency step.
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
            playwright-chromium-main-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browser with Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Replay Migrations on Disposable CI Database
        run: npm run migration:replay
        env:
          MIGRATION_REPLAY_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci?schema=replay

      - name: Check Schema Drift
        run: |
          npm run check:migrations:drift
          npx prisma migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci?schema=replay

      - name: Check Documentation Drift
        run: npm run check-docs-drift

      - name: Lint Documentation
        run: npm run lint:docs

      - name: Type Check & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Run Logic Tests (Vitest)
        id: vitest
        run: npm run test:ci
        env:
          # Unit tests mock @/lib/db, but several suites bypass the mock and
          # import the real client whenever DATABASE_URL names something other
          # than a dummy host. The real client is @neondatabase/serverless over
          # a WebSocket, which cannot speak to the plain Postgres container
          # above, so pointing this at the service made 25 tests exercise a
          # database they can never reach. The container exists for the Prisma
          # CLI steps (migrate deploy / migrate diff), which use the native
          # migration engine and do connect.
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Run Shift-Left Property Fuzz Testing Gate
        id: fuzz
        run: npm run test:fuzz

      - name: Run Stryker Mutation Gate
        id: mutation
        run: npm run test:mutation

      - name: Fast Gate Summary
        if: always()
        run: |
          echo "### ⚡ Fast Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Logic Tests (Vitest) | ${{ steps.vitest.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Property Fuzz Gate | ${{ steps.fuzz.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stryker Mutation Gate | ${{ steps.mutation.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

  security-gate:
    name: Security Gate (Vulnerability Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security Audit Gate
        run: npm run audit:security

      - name: Scan Reachable Git History for Secrets
        run: npm run audit:secrets

  # Part of the PR merge gate for build/visual/performance concerns. Runs only
  # chromium against the full e2e suite — most specs in __tests__/e2e/ are not
  # meaningfully device-dependent, and running all four configured Playwright
  # projects here multiplies wall-clock (and billed) time by four for little
  # additional signal on an ordinary PR push. Genuine cross-device coverage
  # runs alongside this job, pre-merge, in `device-gate` (below), and the full
  # four-device breadth remains available on demand via `cross-device-matrix`.
  heavy-gate:
    name: Heavy Gate (Build, Bundle, Playwright, Web Vitals)
    needs: fast-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Provisional: this used to be part of a single 70-minute job dominated by
    # a 4-device Playwright run; scoping to one device should cut that
    # substantially, but the number below is not yet backed by a measured run
    # (Actions minutes were exhausted while #733 was authored — see ADR 0039).
    # Revisit once a clean run is available rather than guessing further.
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
            playwright-chromium-main-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browser with Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
            nextjs-main-${{ hashFiles('package-lock.json') }}

      - name: Build Production
        # Must be the same entrypoint Vercel runs. `npx next build` defaults to
        # Turbopack on Next 16, which never completes for this app (it was
        # cancelled at 41m47s here and never finished locally either).
        # scripts/build.js pins `next build --webpack`, which is what actually
        # ships, and it also runs the prisma/openapi/docs/standalone phases the
        # production build depends on.
        run: npm run build
        env:
          # Port 59999 has no listener, so @neondatabase/serverless fails fast and
          # static generation falls back. Pointing this at localhost:5432 reaches
          # the Postgres service container above: the Neon driver opens a
          # WebSocket handshake against a server that speaks the Postgres wire
          # protocol, gets no HTTP response, and waits forever with no timeout.
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Verify Bundle Performance Budgets
        id: bundle
        run: npm run analyze:bundle -- --strict

      - name: Run Visual & Drift Detection (Playwright, chromium)
        id: playwright
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"

      - name: Run Real-Browser Sub-Route Web Vitals Performance Gate
        id: page-bench
        run: npm run bench:pages -- --assert
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"

      - name: Verify ADR Invariants & Doctor Health Diagnostics
        run: npm run verify

      - name: Generate Centralized Health Dashboard
        if: always()
        run: |
          # Generate accessibility summary and status files
          node scripts/generate-accessibility-report.js || true

          # Read accessibility status
          ACC_STATUS="❌ Fail"
          if [ -f playwright-report/accessibility-status.txt ]; then
            ACC_STATUS=$(cat playwright-report/accessibility-status.txt)
          elif [ "${{ steps.playwright.outcome }}" = "success" ]; then
            ACC_STATUS="✅ Pass"
          fi

          echo "# 🛡️ Rigor Ecosystem Health Report" >> $GITHUB_STEP_SUMMARY
          echo "### Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verification Layer | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual & Drift Guard** (Playwright, chromium) | ${{ steps.playwright.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Sub-pixel pixel matching & layout constant sync |" >> $GITHUB_STEP_SUMMARY
          echo "| **Accessibility Audits** (Playwright-Axe) | $ACC_STATUS | Automated WCAG compliance scans on interactive states |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sub-Route Real-Browser Performance Gate** | ${{ steps.page-bench.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Real-browser Core Web Vitals (LCP, CLS, TTFB) SLA assertions across sub-routes |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle Performance Budgets** | ${{ steps.bundle.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Initial bundle & chunk gzip performance limits |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*(chromium only — see device-gate and the manual cross-device-matrix job for other devices)*" >> $GITHUB_STEP_SUMMARY

          if [ -f playwright-report/accessibility-summary.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat playwright-report/accessibility-summary.md >> $GITHUB_STEP_SUMMARY
          fi

  # Runs on the pull request itself, alongside heavy-gate, so a device-engine
  # regression is caught before merge instead of after (CI-02 / #733
  # follow-up). heavy-gate already runs the full e2e suite on chromium; this
  # job does not repeat that build+bundle+full-suite+bench work. It adds only
  # the coverage heavy-gate's single chromium project does NOT have: the two
  # specs that are genuinely device-engine dependent (pixel-diffing and
  # touch-input emulation) against the three non-chromium projects. Because
  # this now runs pre-merge, there is no separate post-merge repeat of it —
  # the PR that produced the merged tree already carries this result, so
  # re-running it on the `main` push would check nothing new (the same
  # reasoning ADR 0039 applies to heavy-gate).
  device-gate:
    name: Device Coverage Gate (Tablet Safari, Mobile Safari, Mobile Chrome)
    needs: fast-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Provisional, same caveat as heavy-gate: two spec files across three
    # device projects plus one build, unmeasured. Revisit once real numbers
    # exist.
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-full-${{ github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-full-${{ github.ref_name }}-${{ hashFiles('package-lock.json') }}
            playwright-full-main-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers with Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Build Production
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Run Device-Dependent Specs (Tablet Safari, Mobile Safari, Mobile Chrome)
        run: |
          npx playwright test __tests__/e2e/visual.spec.ts __tests__/e2e/touch-controls.spec.ts \
            --project="Tablet Safari" --project="Mobile Safari" --project="Mobile Chrome"
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"

  # The single required status check branch protection (#732) should point
  # at. GitHub's required-status-checks rule only understands a job's own
  # reported conclusion for the commit under review: a job skipped by its own
  # `if:` (heavy-gate/device-gate outside a pull_request) or skipped as a
  # side effect of a failed `needs:` predecessor reports "skipped", and a
  # required-status-check rule treats "skipped" as satisfied, not blocking.
  # That would let a cancelled Playwright run or a failed fast-gate silently
  # produce a mergeable PR. This job runs with `if: always()` -- unconditionally,
  # for every trigger this workflow has, including workflow_dispatch -- so it
  # still executes when an upstream job failed, was cancelled, or never ran,
  # then fails deliberately unless every predecessor required for this event
  # actually reported "success". CI-03: the step below only knows how to
  # validate `pull_request` and `push`; any other event (workflow_dispatch's
  # manual runs included) hits an explicit default branch that fails the job
  # outright, so a manual trigger can produce neither a "skipped" conclusion
  # (satisfied by default under required-status-checks) nor an accidental
  # "success" from a partial validation -- a merge can never go green on
  # anything other than a real pass of every required predecessor for a
  # recognized event.
  merge-gate:
    name: Merge Gate (Required Checks Summary)
    needs: [fast-gate, security-gate, heavy-gate, device-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate required job results
        run: |
          set -u

          fail=0
          check_required() {
            local job="$1" result="$2"
            echo "${job}: ${result}"
            if [ "${result}" != "success" ]; then
              echo "::error::Required job '${job}' did not succeed (result: ${result})"
              fail=1
            fi
          }

          event="${{ github.event_name }}"

          case "${event}" in
            pull_request)
              # fast-gate and security-gate have no `if:` -- they run, and
              # must succeed, on every trigger this job runs for. heavy-gate
              # and device-gate are pull_request-only by design (the
              # reduced-scope split from #733/#775); on a PR trigger they are
              # the pre-merge device and full-suite-chromium coverage this
              # task exists to require, so a skip here is exactly the failure
              # mode this job guards against, not an expected outcome.
              check_required "fast-gate" "${{ needs.fast-gate.result }}"
              check_required "security-gate" "${{ needs.security-gate.result }}"
              check_required "heavy-gate" "${{ needs.heavy-gate.result }}"
              check_required "device-gate" "${{ needs.device-gate.result }}"
              ;;
            push)
              # Bounded main-push confirmation (#732's direct-push safety
              # net): heavy-gate/device-gate are expected to report "skipped"
              # here (their own `if:` excludes this event) -- the merged PR
              # already required both to succeed before this push could
              # happen, so re-requiring them adds no signal, only cost.
              check_required "fast-gate" "${{ needs.fast-gate.result }}"
              check_required "security-gate" "${{ needs.security-gate.result }}"
              echo "heavy-gate: ${{ needs.heavy-gate.result }} (not required outside pull_request)"
              echo "device-gate: ${{ needs.device-gate.result }} (not required outside pull_request)"
              ;;
            *)
              # CI-03: every other trigger -- workflow_dispatch (a manual run,
              # with or without the cross_device_matrix input) and any
              # future/unrecognized event -- has no defined validation here.
              # Without this branch, an unhandled event previously left this
              # job's own `if:` excluding it entirely, so GitHub recorded a
              # "skipped" conclusion for the exact check name branch
              # protection requires, and GitHub treats a skipped required
              # check as satisfied rather than blocking. Failing here
              # deliberately means a manual or unrecognized trigger can never
              # produce a "skipped" result, and can never produce an
              # accidental "success" either, for this shared required
              # context.
              echo "::error::Merge Gate has no defined validation for event '${event}'; failing closed so this required check can never be satisfied by an unsupported trigger."
              fail=1
              ;;
          esac

          exit "${fail}"

  # Full four-device matrix against the complete e2e suite, on demand only.
  # This is the breadth the old job ran on every push; keeping it manual
  # avoids paying for it automatically while still making it one click away
  # when a release or a device-sensitive change warrants the full check.
  cross-device-matrix:
    name: Cross-Device Matrix (On Demand)
    if: github.event_name == 'workflow_dispatch' && inputs.cross_device_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-full-${{ github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-full-${{ github.ref_name }}-${{ hashFiles('package-lock.json') }}
            playwright-full-main-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers with Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Build Production
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Run Full Playwright Suite (All Devices)
        run: npx playwright test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"
