name: Synthetic User Probes & Journey Monitoring

on:
  schedule:
    # Once daily. This job exists to catch silent production regressions, which
    # is a daily-resolution question, not a half-hourly one. At the previous
    # */30 cadence this workflow alone consumed roughly 2,880 billable minutes a
    # month -- about 144% of the private-repo free allowance -- so the interval
    # is a cost decision as much as a monitoring one. Raise it deliberately.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Origin to probe (defaults to the canonical production domain)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Canonical production domain, per ADR/AGENTS.md §18.
  DEFAULT_PROBE_TARGET: "https://deruiter.dev"

jobs:
  synthetic-probe-run:
    name: Headless Synthetic Probe Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #1771: the same digest-pinned Playwright image as ci.yml's browser
    # jobs, so Chromium and its OS libraries are preinstalled and match the
    # locked @playwright/test version exactly.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Probe Target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${DEFAULT_PROBE_TARGET}"
          fi
          echo "url=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Probing ${TARGET}"

      - name: Run Synthetic Journey Probes
        id: probes
        # Probes run against the deployed origin. The playwright config skips its
        # local webServer whenever PLAYWRIGHT_TEST_BASE_URL is set, so no
        # production build is needed here -- previously this step started
        # `next start` with nothing built and failed before any probe ran.
        run: npx --no-install playwright test __tests__/e2e/synthetic-probes.spec.ts --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.target.outputs.url }}

      - name: Publish Synthetic Health Summary
        if: always()
        run: |
          {
            echo "# 🛰️ Synthetic Journey Monitoring Report"
            echo ""
            echo "- **Target:** ${{ steps.target.outputs.url }}"
            echo "- **Checked:** $(date -u)"
            echo "- **Result:** ${{ steps.probes.outcome == 'success' && '✅ All probed journeys healthy' || '❌ Probe run did not pass — see the job log for the failing spec' }}"
            echo ""
            echo "Journeys covered by this suite:"
            echo ""
            echo "| Synthetic Journey | Description |"
            echo "| --- | --- |"
            echo "| Landing & Pretext Layout | Card heights, text layout & filtering |"
            echo "| Command Palette | Keyboard shortcuts & instant route discovery |"
            echo "| Proof Studio Engine | AST graph deductions & multi-format export |"
            echo "| Arcade Canvas 2D | Game canvas lifecycle & controls |"
            echo "| API Telemetry & Schemas | Ingest endpoint, rate-limiting & response schema |"
            echo "| Warm Service Worker Navigation | Arcade route remains available after service-worker activation |"
            echo ""
            echo "*Per-journey status is not derived here; the suite reports one outcome."
            echo "Read the job log to see which spec failed.*"
          } >> "$GITHUB_STEP_SUMMARY"
