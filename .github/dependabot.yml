version: 2
updates:
  # One weekly PR for every action bump instead of one PR per action. It runs
  # on the same Monday slot as npm so a week's dependency work lands together,
  # ahead of the Sunday release train (ADR 0063).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/Chicago"
    commit-message:
      prefix: "ci"
    # A release has to be a week old before it is proposed, so a tag that is
    # yanked or found compromised in its first days never reaches a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Canonical PostgreSQL 17 image pin for CI static-gate, Neon backups, and
  # disposable local migration replay (`npm run deps:fix` propagates digest
  # bumps across workflows and scripts; major stays on 17 to match Neon).
  - package-ecosystem: "docker"
    directory: "/infra/docker/postgres"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/Chicago"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  # Frozen Python constraints for the CDISC CORE validation workflow
  # (`scripts/study-data-core-constraints.txt`), audited with `pip-audit`.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/Chicago"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      python-study-data-core:
        patterns:
          - "*"

  # npm updates arrive as one grouped weekly PR for patch and minor releases
  # (#2511). Majors are ignored here and taken one per PR by hand, because
  # each needs its own migration (vitest, eslint, jsdom, framer-motion).
  # `next`, `@next/env`, and `eslint-config-next` are exact pins that must move
  # together, so they get their own group. Security updates skip the cooldown
  # and the weekly slot, and arrive together in one `npm-security` PR.
  #
  # The OSS credits and notices are generated at install, not committed (ADR
  # 0057 amendment), so these PRs pass CI by themselves. The exceptions are the
  # `playwright` and `duckdb-wasm` groups: Dependabot cannot run
  # `npm run deps:fix` to move the Playwright CI images (#2730) or refresh the
  # vendored DuckDB WebAssembly extensions, so carry those PRs on a `chore/`
  # branch; the recipe is in docs/how-to/manage-dependency-licenses.md.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    # Version updates wait for a release to age: 3 days for a patch, 7 for a
    # minor. Malicious npm releases are usually caught and pulled within that
    # window. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned for runtime compatibility (SECURITY.md, #995).
      - dependency-name: "jsdom"
      # 0.50.0 brings re2js 2.8.6 (GHSA-gg6h-894w-4m9c, high) through an
      # exact pin in markdownlint 0.42.0, and argparse 3 (PSF-2.0, not in
      # config/license-policy.json) through js-yaml 5.5 (SECURITY.md). Only
      # this release is skipped, so the next one is proposed and checked.
      - dependency-name: "markdownlint-cli"
        versions: ["0.50.0"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      nextjs:
        patterns:
          - "next"
          - "@next/env"
          - "eslint-config-next"
      # A new @playwright/test also needs the Playwright CI container images
      # moved (`npm run deps:fix`), which Dependabot cannot do, so it gets a
      # PR of its own and the rest of the week's bumps are not held up by it.
      playwright:
        patterns:
          - "@playwright/test"
      # A new @duckdb/duckdb-wasm needs vendored wasm_eh extension binaries and
      # SHA-256 digests refreshed (`npm run deps:fix`), so isolate it from
      # routine minor/patch bumps.
      duckdb-wasm:
        patterns:
          - "@duckdb/duckdb-wasm"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
