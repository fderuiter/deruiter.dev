name: Study Data CDISC CORE

# #2603: stop grading our own homework. The open-source CDISC Rules Engine
# (CORE) validates the Study Data Pipeline's seed-301 SDTM Dataset-JSON and
# Define-XML against SDTMIG 3.4 and the DEMO-301 USDM fixture against USDM
# 4.0. `scripts/study-data-core.ts reconcile` sets CORE's findings beside the
# in-browser conformance gate's and fails on any finding
# `scripts/study-data-core-allowlist.json` does not explain, or on an entry
# CORE no longer reports. The Define-XML XSD check runs in the unit suite
# (`__tests__/study-data-define.test.ts`).
#
# #2992: CORE also runs over every "Inject an issue" scenario, and
# `study-data-core.ts record` writes every view's findings to
# lib/study-data/internal/core/recorded-findings.json, which the site reads.
# The job fails when the committed file differs from what CORE reports now,
# and uploads the fresh file so the PR can commit it
# (docs/how-to/refresh-cdisc-core-findings.md).
#
# CORE v0.17.1 ships its rule and terminology cache in the repository, so no
# CDISC Library API key is needed. It publishes no ADaMIG rules yet; the
# ADaM layer is reported as not run until it does. This is a separate
# workflow, not a gate in ci.yml: it reads only lib/study-data and its own
# files.

on:
  push:
    branches: [main]
    paths:
      - "lib/study-data/**"
      - "scripts/study-data-core*"
      - ".github/workflows/study-data-core.yml"
  pull_request:
    paths:
      - "lib/study-data/**"
      - "scripts/study-data-core*"
      - ".github/workflows/study-data-core.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: study-data-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned engine: the tag and the commit it must resolve to.
  CORE_TAG: v0.17.1
  CORE_COMMIT: 2a90a3872a7e3b07c15abe84744026c94a7a04b0

jobs:
  core:
    name: CDISC CORE (SDTMIG 3.4, USDM 4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install CDISC CORE
        run: |
          git clone --quiet --depth 1 --branch "$CORE_TAG" \
            https://github.com/cdisc-org/cdisc-rules-engine.git "$RUNNER_TEMP/core"
          actual="$(git -C "$RUNNER_TEMP/core" rev-parse HEAD)"
          if [ "$actual" != "$CORE_COMMIT" ]; then
            echo "::error::CORE $CORE_TAG resolved to $actual, expected $CORE_COMMIT."
            exit 1
          fi
          python3 --version
          python3 -m venv "$RUNNER_TEMP/core-venv"
          "$RUNNER_TEMP/core-venv/bin/pip" install --quiet \
            -c scripts/study-data-core-constraints.txt "$RUNNER_TEMP/core"

      - name: Export Pipeline Outputs
        run: |
          # CORE refuses a Define-XML that cites a CT release its cache lacks,
          # so validate against the newest cached SDTM CT release.
          ct="$(ls "$RUNNER_TEMP/core/resources/cache" | sed -n 's/^sdtmct-\(.*\)\.pkl$/\1/p' | sort | tail -n 1)"
          echo "Newest cached SDTM CT release: $ct"
          npx --no-install tsx scripts/study-data-core.ts export-views "$RUNNER_TEMP/core-in" --ct-version "$ct"

      - name: Run CORE over Every View
        run: |
          scripts/study-data-core-views.sh "$RUNNER_TEMP/core" \
            "$RUNNER_TEMP/core-venv/bin/python" \
            "$RUNNER_TEMP/core-in" "$RUNNER_TEMP/core-reports" 4

      - name: Reconcile with the In-Browser Gate
        id: reconcile
        run: |
          npx --no-install tsx scripts/study-data-core.ts reconcile \
            "$RUNNER_TEMP/core-in/default" "$RUNNER_TEMP/core-reports/default" \
            --engine "CDISC CORE $CORE_TAG"

      - name: Check the Recorded Findings Are Current
        if: ${{ !cancelled() && steps.reconcile.conclusion != 'skipped' }}
        run: |
          npx --no-install tsx scripts/study-data-core.ts record \
            "$RUNNER_TEMP/core-in" "$RUNNER_TEMP/core-reports" \
            --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT"
          file=lib/study-data/internal/core/recorded-findings.json
          if ! git diff --quiet -- "$file"; then
            git diff --stat -- "$file"
            echo "::error file=$file::The recorded CDISC CORE findings are stale. Download the study-data-core-recorded-findings artifact from this run and commit it as $file (docs/how-to/refresh-cdisc-core-findings.md)."
            exit 1
          fi
          echo "The recorded CDISC CORE findings match this run."

      - name: Publish Job Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/core-reports/default/reconciliation.md" ]; then
            cat "$RUNNER_TEMP/core-reports/default/reconciliation.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Recorded Findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-data-core-recorded-findings
          path: lib/study-data/internal/core/recorded-findings.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload CORE Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-data-core-reports
          path: |
            ${{ runner.temp }}/core-reports/
            ${{ runner.temp }}/core-in/*/export-notes.json
            ${{ runner.temp }}/core-in/default/gate-findings.json
          retention-days: 14
          if-no-files-found: warn
