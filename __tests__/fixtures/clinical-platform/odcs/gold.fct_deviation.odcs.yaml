# ODCS v3.2.0 data contract for gold.fct_deviation. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/gold.fct_deviation"
name: "Deviation facts"
version: "1.0.0"
status: active
domain: "Operations mart"
tags:
  - gold
  - confidential
  - personal-health-data
  - synthetic
description:
  purpose: "Protocol deviations with their time to identification."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: fct_deviation
    name: fct_deviation
    physicalName: gold.fct_deviation
    physicalType: table
    logicalType: object
    description: "Protocol deviations with their time to identification."
    dataGranularityDescription: "One row per protocol deviation."
    properties:
      - name: deviation_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Deviation id (degenerate dimension)."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
      - name: subject_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Subject id (degenerate dimension)."
        required: true
        classification: confidential
      - name: study_key
        logicalType: integer
        physicalType: INTEGER
        description: Study.
        required: true
        classification: internal
      - name: site_key
        logicalType: integer
        physicalType: INTEGER
        description: "Site version in force when the deviation occurred."
        required: true
        classification: internal
      - name: country_key
        logicalType: integer
        physicalType: INTEGER
        description: "Country of the site."
        required: true
        classification: internal
      - name: occurred_date_key
        logicalType: integer
        physicalType: INTEGER
        description: "Date the deviation occurred."
        required: true
        classification: internal
      - name: identified_date_key
        logicalType: integer
        physicalType: INTEGER
        description: "Date the deviation was identified."
        required: true
        classification: internal
      - name: deviation_category
        logicalType: string
        logicalTypeOptions:
          maxLength: 80
        physicalType: "VARCHAR(80)"
        description: "Deviation category."
        required: true
        classification: internal
      - name: importance
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "important or not-important."
        required: true
        classification: internal
      - name: is_important
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Whether the deviation is important per ICH E3."
        required: true
        classification: internal
      - name: days_to_identify
        logicalType: integer
        physicalType: INTEGER
        description: "Days from occurrence to identification."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: fct_deviation_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - deviation_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (deviation_id) identifies one row."
team:
  name: "Operations mart"
  members:
    - username: clinical-quality-lead
      name: "Clinical Quality Lead"
      role: owner
    - username: clinical-quality-data-steward
      name: "Clinical Quality Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99.5
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 10
    unit: "y"
    driver: operational
    description: "Sponsor records policy for operational and derived data: a policy choice, not a regulatory minimum."
customProperties:
  - property: dataClassification
    value: confidential
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - gold.dim_country
      - gold.dim_site
      - gold.dim_study
      - silver.ctms_deviation
      - silver.site
  - property: consumers
    value:
      - "metric:important_deviation_rate"
      - "metric:non_important_deviation_rate"
      - "metric:subjects_with_important_deviation"
