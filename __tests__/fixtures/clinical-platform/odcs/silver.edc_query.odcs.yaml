# ODCS v3.2.0 data contract for silver.edc_query. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/silver.edc_query"
name: "EDC queries"
version: "1.0.0"
status: active
domain: EDC
tags:
  - silver
  - confidential
  - personal-health-data
  - synthetic
description:
  purpose: "EDC data queries with their open, answer and close times."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: edc_query
    name: edc_query
    physicalName: silver.edc_query
    physicalType: table
    logicalType: object
    description: "EDC data queries with their open, answer and close times."
    dataGranularityDescription: "One row per query."
    properties:
      - name: query_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Query id."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: confidential
      - name: visit_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Visit record id the query is raised on."
        required: true
        classification: confidential
      - name: subject_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Subject id."
        required: true
        classification: confidential
      - name: study_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Protocol id."
        required: true
        classification: internal
      - name: site_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Site id."
        required: true
        classification: internal
      - name: queried_field
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Queried field, as DOMAIN.VARIABLE."
        required: true
        classification: internal
      - name: query_origin
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "How the query was raised: edit-check or manual."
        required: true
        classification: internal
      - name: opened_at
        logicalType: timestamp
        physicalType: TIMESTAMPTZ
        description: "UTC time the query was opened."
        required: true
        classification: confidential
      - name: answered_at
        logicalType: timestamp
        physicalType: TIMESTAMPTZ
        description: "UTC time the site answered."
        required: false
        classification: confidential
      - name: closed_at
        logicalType: timestamp
        physicalType: TIMESTAMPTZ
        description: "UTC time the query was closed."
        required: false
        classification: confidential
      - name: query_status
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "State at the data cut."
        required: true
        classification: internal
      - name: source_system
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Source system the record came from."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: edc_query_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - query_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (query_id) identifies one row."
team:
  name: EDC
  members:
    - username: clinical-data-management-lead
      name: "Clinical Data Management Lead"
      role: owner
    - username: clinical-data-steward
      name: "Clinical Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 25
    unit: "y"
    driver: regulatory
    description: "Regulation (EU) No 536/2014, Article 58: the trial master file is archived for at least 25 years after the end of the trial."
customProperties:
  - property: dataClassification
    value: confidential
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - bronze.edc.queries
  - property: consumers
    value:
      - "product:gold.fct_query"
      - "product:gold.fct_kri_snapshot"
