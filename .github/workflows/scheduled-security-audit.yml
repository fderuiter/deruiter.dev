name: Scheduled Security Audit

on:
  schedule:
    # Daily at 06:00 UTC. Continuous vulnerability monitoring for production
    # dependencies during dormant development periods without active PRs.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scheduled-security-audit:
    name: Scheduled Vulnerability Audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Setup Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/study-data-core-constraints.txt"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security Audit Gate
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run audit:security -- --fail-on-warning --severity=moderate
        continue-on-error: true

      - name: Audit Python Study-Data-Core Constraints
        id: pip_audit
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/pip" install --quiet "pip-audit==2.10.1"
          "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" \
            -r scripts/study-data-core-constraints.txt \
            --no-deps \
            --disable-pip
        continue-on-error: true

      - name: Check License Policy & Exception Expiry Window
        id: license_audit
        run: npm run audit:licenses -- --fail-on-expiring
        continue-on-error: true

      - name: Triage Security Issue Escalation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECURITY_TRIAGE_APPLY: ${{ vars.SECURITY_TRIAGE_APPLY }}
        run: npm run audit:triage

      - name: Fail Workflow On Audit Failure
        if: steps.audit.outcome == 'failure' || steps.pip_audit.outcome == 'failure' || steps.license_audit.outcome == 'failure'
        run: exit 1
