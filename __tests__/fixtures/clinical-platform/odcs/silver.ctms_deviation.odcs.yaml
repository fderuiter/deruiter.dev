# ODCS v3.2.0 data contract for silver.ctms_deviation. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/silver.ctms_deviation"
name: "Protocol deviations"
version: "1.0.0"
status: active
domain: CTMS
tags:
  - silver
  - confidential
  - personal-health-data
  - synthetic
description:
  purpose: "Protocol deviations logged in CTMS."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: ctms_deviation
    name: ctms_deviation
    physicalName: silver.ctms_deviation
    physicalType: table
    logicalType: object
    description: "Protocol deviations logged in CTMS."
    dataGranularityDescription: "One row per deviation."
    properties:
      - name: deviation_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Deviation id."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: confidential
      - name: study_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Protocol id."
        required: true
        classification: internal
      - name: site_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Site id."
        required: true
        classification: internal
      - name: subject_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Subject id."
        required: true
        classification: confidential
      - name: deviation_category
        logicalType: string
        logicalTypeOptions:
          maxLength: 80
        physicalType: "VARCHAR(80)"
        description: "Deviation category."
        required: true
        classification: internal
      - name: importance
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Importance per ICH E3: important or not-important."
        required: true
        classification: internal
      - name: occurred_on
        logicalType: date
        physicalType: DATE
        description: "Date the deviation occurred."
        required: true
        classification: confidential
      - name: identified_on
        logicalType: date
        physicalType: DATE
        description: "Date the deviation was identified."
        required: true
        classification: confidential
      - name: source_system
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Source system the record came from."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: ctms_deviation_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - deviation_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (deviation_id) identifies one row."
team:
  name: CTMS
  members:
    - username: clinical-quality-lead
      name: "Clinical Quality Lead"
      role: owner
    - username: clinical-quality-data-steward
      name: "Clinical Quality Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 25
    unit: "y"
    driver: regulatory
    description: "Regulation (EU) No 536/2014, Article 58: the trial master file is archived for at least 25 years after the end of the trial."
customProperties:
  - property: dataClassification
    value: confidential
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - bronze.ctms.deviations
  - property: consumers
    value:
      - "product:gold.fct_deviation"
      - "product:gold.fct_kri_snapshot"
