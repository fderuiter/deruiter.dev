version: 2
updates:
  # One weekly PR for every action bump instead of one PR per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm updates arrive as one grouped weekly PR for patch and minor releases
  # (#2511). Majors are ignored here and taken one per PR by hand, because
  # each needs its own migration (vitest, eslint, jsdom, framer-motion).
  # `next` and `eslint-config-next` are exact pins that must move together,
  # so they get their own group. Every npm PR then needs `npm run deps:fix`,
  # which regenerates the OSS credits and moves the Playwright CI images to a
  # new @playwright/test (#2730). The recipe is in
  # docs/how-to/manage-dependency-licenses.md.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned for runtime compatibility (SECURITY.md, #995).
      - dependency-name: "jsdom"
      # 0.50.0 brings re2js 2.8.6 (GHSA-gg6h-894w-4m9c, high) through an
      # exact pin in markdownlint 0.42.0, and argparse 3 (PSF-2.0, not in
      # config/license-policy.json) through js-yaml 5.5 (SECURITY.md). Only
      # this release is skipped, so the next one is proposed and checked.
      - dependency-name: "markdownlint-cli"
        versions: ["0.50.0"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
