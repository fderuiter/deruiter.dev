# Clinical Data Platform governed metrics as dbt MetricFlow semantic models and metrics.
# Generated from METRIC_REGISTRY in lib/clinical-platform; do not edit by hand.
# Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
# Expressions are DuckDB SQL. Data cut: 2026-09-30.
semantic_models:
  - name: dim_country
    description: "Conformed country dimension. Grain: One row per country with a site."
    model: "ref('dim_country')"
    entities:
      - name: country
        type: primary
        expr: country_key
    dimensions:
      - name: country_code
        type: categorical
        description: "ISO 3166-1 alpha-2 country code."
      - name: region
        type: categorical
        description: "Operational region."
  - name: dim_milestone
    description: "Conformed milestone dimension: the milestone kinds in lifecycle order. Grain: One row per milestone kind."
    model: "ref('dim_milestone')"
    entities:
      - name: milestone
        type: primary
        expr: milestone_key
    dimensions:
      - name: milestone_kind
        type: categorical
        description: "Milestone kind."
  - name: dim_site
    description: "Conformed site dimension, slowly changing type 2 on site status and principal investigator. Grain: One row per site version: a new row each time the status or the principal investigator changes."
    model: "ref('dim_site')"
    defaults:
      agg_time_dimension: valid_from
    entities:
      - name: site
        type: primary
        expr: site_key
    dimensions:
      - name: site_id
        type: categorical
        description: "Site id, the natural key."
      - name: study_id
        type: categorical
        description: "Protocol id."
      - name: country_code
        type: categorical
        description: "ISO 3166-1 alpha-2 country code."
      - name: valid_from
        type: time
        expr: valid_from
        type_params:
          time_granularity: day
    measures:
      - name: enrollment_vs_plan__denominator
        description: "The denominator of enrollment_vs_plan."
        agg: sum
        expr: "CASE WHEN is_current = TRUE THEN CAST(planned_enrollment AS DOUBLE) ELSE 0 END"
        agg_time_dimension: valid_from
      - name: site_activation_cycle_time__value
        description: "Measure of site_activation_cycle_time."
        agg: median
        expr: "CASE WHEN version_number = 1 AND activated_on IS NOT NULL THEN CAST(date_diff('day', valid_from, activated_on) AS DOUBLE) END"
        agg_time_dimension: valid_from
      - name: sites_selected__value
        description: "Measure of sites_selected."
        agg: sum
        expr: "CASE WHEN version_number = 1 AND selected_on IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: valid_from
      - name: sites_contracted__value
        description: "Measure of sites_contracted."
        agg: sum
        expr: "CASE WHEN version_number = 1 AND contracted_on IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: valid_from
      - name: sites_irb_approved__value
        description: "Measure of sites_irb_approved."
        agg: sum
        expr: "CASE WHEN version_number = 1 AND irb_approved_on IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: valid_from
      - name: sites_initiated__value
        description: "Measure of sites_initiated."
        agg: sum
        expr: "CASE WHEN version_number = 1 AND initiated_on IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: valid_from
      - name: sites_activated__value
        description: "Measure of sites_activated."
        agg: sum
        expr: "CASE WHEN version_number = 1 AND activated_on IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: valid_from
      - name: sites_with_first_subject_in__value
        description: "Measure of sites_with_first_subject_in."
        agg: sum
        expr: "CASE WHEN version_number = 1 AND first_subject_in_on IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: valid_from
      - name: selection_to_contract_days__value
        description: "Measure of selection_to_contract_days."
        agg: median
        expr: "CASE WHEN version_number = 1 AND selected_on IS NOT NULL AND contracted_on IS NOT NULL THEN CAST(date_diff('day', selected_on, contracted_on) AS DOUBLE) END"
        agg_time_dimension: valid_from
      - name: contract_to_irb_approval_days__value
        description: "Measure of contract_to_irb_approval_days."
        agg: median
        expr: "CASE WHEN version_number = 1 AND contracted_on IS NOT NULL AND irb_approved_on IS NOT NULL THEN CAST(date_diff('day', contracted_on, irb_approved_on) AS DOUBLE) END"
        agg_time_dimension: valid_from
      - name: irb_approval_to_initiation_days__value
        description: "Measure of irb_approval_to_initiation_days."
        agg: median
        expr: "CASE WHEN version_number = 1 AND irb_approved_on IS NOT NULL AND initiated_on IS NOT NULL THEN CAST(date_diff('day', irb_approved_on, initiated_on) AS DOUBLE) END"
        agg_time_dimension: valid_from
      - name: initiation_to_activation_days__value
        description: "Measure of initiation_to_activation_days."
        agg: median
        expr: "CASE WHEN version_number = 1 AND initiated_on IS NOT NULL AND activated_on IS NOT NULL THEN CAST(date_diff('day', initiated_on, activated_on) AS DOUBLE) END"
        agg_time_dimension: valid_from
      - name: activation_to_first_subject_in_days__value
        description: "Measure of activation_to_first_subject_in_days."
        agg: median
        expr: "CASE WHEN version_number = 1 AND activated_on IS NOT NULL AND first_subject_in_on IS NOT NULL THEN CAST(date_diff('day', activated_on, first_subject_in_on) AS DOUBLE) END"
        agg_time_dimension: valid_from
  - name: dim_study
    description: "Conformed study dimension. Grain: One row per study."
    model: "ref('dim_study')"
    entities:
      - name: study
        type: primary
        expr: study_key
    dimensions:
      - name: study_id
        type: categorical
        description: "Protocol id, the natural key."
      - name: therapeutic_area
        type: categorical
        description: "Therapeutic area."
      - name: product_type
        type: categorical
        description: "Investigational product type."
      - name: phase
        type: categorical
        description: "Development phase or device study stage."
      - name: operating_model
        type: categorical
        description: "Sponsor or CRO."
      - name: study_status
        type: categorical
        description: "Lifecycle status at the data cut."
  - name: dim_vendor
    description: "Conformed vendor dimension, with key 0 for spend that has no vendor (investigator grants). Grain: One row per vendor, plus the not-applicable member."
    model: "ref('dim_vendor')"
    entities:
      - name: vendor
        type: primary
        expr: vendor_key
    dimensions:
      - name: vendor_name
        type: categorical
        description: "Fictional vendor name."
  - name: fct_cec_adjudication
    description: "Events sent to the clinical events committee, with when each was reported and adjudicated (#2881). Grain: One row per event sent for adjudication."
    model: "ref('fct_cec_adjudication')"
    defaults:
      agg_time_dimension: reported_date
    entities:
      - name: fct_cec_adjudication
        type: primary
        expr: event_id
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: reported_date
        type: time
        expr: "CAST(strptime(CAST(reported_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: cec_events_reported__value
        description: "Measure of cec_events_reported."
        agg: sum
        expr: "1"
        agg_time_dimension: reported_date
      - name: cec_events_adjudicated__value
        description: "Measure of cec_events_adjudicated."
        agg: sum
        expr: "CASE WHEN adjudicated_date_key IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: reported_date
      - name: cec_adjudication_backlog__value
        description: "Measure of cec_adjudication_backlog."
        agg: sum
        expr: "CASE WHEN adjudicated_date_key IS NULL THEN 1 ELSE 0 END"
        agg_time_dimension: reported_date
      - name: cec_adjudication_time_median__value
        description: "Measure of cec_adjudication_time_median."
        agg: median
        expr: "CASE WHEN adjudicated_date_key IS NOT NULL THEN CAST(date_diff('day', CAST(strptime(CAST(reported_date_key AS VARCHAR), '%Y%m%d') AS DATE), CAST(strptime(CAST(adjudicated_date_key AS VARCHAR), '%Y%m%d') AS DATE)) AS DOUBLE) END"
        agg_time_dimension: reported_date
  - name: fct_deviation
    description: "Protocol deviations with their time to identification. Grain: One row per protocol deviation."
    model: "ref('fct_deviation')"
    defaults:
      agg_time_dimension: occurred_date
    entities:
      - name: fct_deviation
        type: primary
        expr: deviation_id
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: deviation_category
        type: categorical
        description: "Deviation category."
      - name: importance
        type: categorical
        description: "important or not-important."
      - name: occurred_date
        type: time
        expr: "CAST(strptime(CAST(occurred_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: important_deviation_rate__numerator
        description: "The numerator of important_deviation_rate."
        agg: sum
        expr: "CASE WHEN is_important = TRUE THEN 1 ELSE 0 END"
        agg_time_dimension: occurred_date
      - name: non_important_deviation_rate__numerator
        description: "The numerator of non_important_deviation_rate."
        agg: sum
        expr: "CASE WHEN is_important = FALSE THEN 1 ELSE 0 END"
        agg_time_dimension: occurred_date
      - name: subjects_with_important_deviation__numerator
        description: "The numerator of subjects_with_important_deviation."
        agg: count_distinct
        expr: "CASE WHEN is_important = TRUE THEN subject_id END"
        agg_time_dimension: occurred_date
      - name: protocol_deviation_count__value
        description: "Measure of protocol_deviation_count."
        agg: sum
        expr: "1"
        agg_time_dimension: occurred_date
  - name: fct_enrollment
    description: "Subject enrollment events: screened, enrolled, completed and discontinued. Grain: One row per subject per enrollment event."
    model: "ref('fct_enrollment')"
    defaults:
      agg_time_dimension: event_date
    entities:
      - name: fct_enrollment
        type: primary
        expr: "CAST(subject_id AS VARCHAR) || '|' || CAST(event_type AS VARCHAR)"
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: screen_failure_reason
        type: categorical
        description: "Why screening failed; null unless the subject failed screening (degenerate dimension)."
      - name: event_date
        type: time
        expr: "CAST(strptime(CAST(event_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: subjects_screened__value
        description: "Measure of subjects_screened."
        agg: sum
        expr: "CASE WHEN event_type = 'screened' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: subjects_enrolled__value
        description: "Measure of subjects_enrolled."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: enrollment_vs_plan__numerator
        description: "The numerator of enrollment_vs_plan."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: screen_failure_rate__numerator
        description: "The numerator of screen_failure_rate."
        agg: sum
        expr: "CASE WHEN event_type = 'screened' AND subject_status = 'screen-failed' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: screen_failure_rate__denominator
        description: "The denominator of screen_failure_rate."
        agg: sum
        expr: "CASE WHEN event_type = 'screened' AND subject_status <> 'screening' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: screen_failures__value
        description: "Measure of screen_failures."
        agg: sum
        expr: "CASE WHEN event_type = 'screened' AND subject_status = 'screen-failed' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: early_termination_rate__numerator
        description: "The numerator of early_termination_rate."
        agg: sum
        expr: "CASE WHEN event_type = 'discontinued' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: early_termination_rate__denominator
        description: "The denominator of early_termination_rate."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: important_deviation_rate__denominator
        description: "The denominator of important_deviation_rate."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: non_important_deviation_rate__denominator
        description: "The denominator of non_important_deviation_rate."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: subjects_with_important_deviation__denominator
        description: "The denominator of subjects_with_important_deviation."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
      - name: cost_per_enrolled_subject__denominator
        description: "The denominator of cost_per_enrolled_subject."
        agg: sum
        expr: "CASE WHEN event_type = 'enrolled' THEN 1 ELSE 0 END"
        agg_time_dimension: event_date
  - name: fct_milestone
    description: "Study milestones, planned against actual. Grain: One row per study and milestone kind."
    model: "ref('fct_milestone')"
    defaults:
      agg_time_dimension: actual_date
    entities:
      - name: fct_milestone
        type: primary
        expr: "CAST(study_key AS VARCHAR) || '|' || CAST(milestone_key AS VARCHAR)"
      - name: study
        type: foreign
        expr: study_key
      - name: milestone
        type: foreign
        expr: milestone_key
    dimensions:
      - name: actual_date
        type: time
        expr: "CAST(strptime(CAST(actual_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: fpi_to_lpi_days__actual_date
        description: "Actual milestone date of fpi_to_lpi_days."
        agg: max
        expr: "CAST(strptime(CAST(actual_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        agg_time_dimension: actual_date
      - name: lplv_to_dbl_days__actual_date
        description: "Actual milestone date of lplv_to_dbl_days."
        agg: max
        expr: "CAST(strptime(CAST(actual_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        agg_time_dimension: actual_date
  - name: fct_monitoring_visit
    description: "Monitoring visits with source data verification and report timeliness. Grain: One row per monitoring visit."
    model: "ref('fct_monitoring_visit')"
    defaults:
      agg_time_dimension: visit_date
    entities:
      - name: fct_monitoring_visit
        type: primary
        expr: monitoring_visit_id
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: visit_date
        type: time
        expr: "CAST(strptime(CAST(visit_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: sdv_completion__numerator
        description: "The numerator of sdv_completion."
        agg: sum
        expr: "CAST(sdv_pages_verified AS DOUBLE)"
        agg_time_dimension: visit_date
      - name: sdv_completion__denominator
        description: "The denominator of sdv_completion."
        agg: sum
        expr: "CAST(sdv_pages_due AS DOUBLE)"
        agg_time_dimension: visit_date
      - name: monitoring_reports_overdue__value
        description: "Measure of monitoring_reports_overdue."
        agg: sum
        expr: "CASE WHEN report_final_date_key IS NULL AND date_diff('day', CAST(strptime(CAST(report_due_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') > 0 THEN 1 ELSE 0 END"
        agg_time_dimension: visit_date
      - name: monitoring_report_cycle_time_median__value
        description: "Measure of monitoring_report_cycle_time_median."
        agg: median
        expr: "CASE WHEN days_to_final_report IS NOT NULL THEN CAST(days_to_final_report AS DOUBLE) END"
        agg_time_dimension: visit_date
  - name: fct_planned_monitoring_visit
    description: "Interim monitoring visits the monitoring plan schedules at each active site, each against the visit that met it. Grain: One row per planned interim monitoring visit: one per interim visit made, plus the next one due at each site still being monitored."
    model: "ref('fct_planned_monitoring_visit')"
    defaults:
      agg_time_dimension: due_date
    entities:
      - name: fct_planned_monitoring_visit
        type: primary
        expr: planned_visit_id
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: due_date
        type: time
        expr: "CAST(strptime(CAST(due_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: monitoring_visits_overdue__value
        description: "Measure of monitoring_visits_overdue."
        agg: sum
        expr: "CASE WHEN actual_date_key IS NULL AND date_diff('day', CAST(strptime(CAST(due_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') > 0 THEN 1 ELSE 0 END"
        agg_time_dimension: due_date
  - name: fct_query
    description: "Data queries with their resolution times. Grain: One row per query."
    model: "ref('fct_query')"
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: fct_query
        type: primary
        expr: query_id
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: queried_form
        type: categorical
        description: "CRF form of the queried field: its CDASH domain, the part of queried_field before the dot."
      - name: opened_date
        type: time
        expr: "CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: query_rate_per_100_visits__numerator
        description: "The numerator of query_rate_per_100_visits."
        agg: sum
        expr: "1"
        agg_time_dimension: opened_date
      - name: open_query_count__value
        description: "Measure of open_query_count."
        agg: sum
        expr: "CASE WHEN query_status IN ('open', 'answered') THEN 1 ELSE 0 END"
        agg_time_dimension: opened_date
      - name: query_aging_mean__value
        description: "Measure of query_aging_mean."
        agg: average
        expr: "CASE WHEN query_status IN ('open', 'answered') THEN CAST(date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') AS DOUBLE) END"
        agg_time_dimension: opened_date
      - name: query_resolution_time_median__value
        description: "Measure of query_resolution_time_median."
        agg: median
        expr: "CASE WHEN closed_date_key IS NOT NULL THEN CAST(date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), CAST(strptime(CAST(closed_date_key AS VARCHAR), '%Y%m%d') AS DATE)) AS DOUBLE) END"
        agg_time_dimension: opened_date
      - name: open_queries_aged_0_7_days__value
        description: "Measure of open_queries_aged_0_7_days."
        agg: sum
        expr: "CASE WHEN query_status IN ('open', 'answered') AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') >= 0 AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') <= 7 THEN 1 ELSE 0 END"
        agg_time_dimension: opened_date
      - name: open_queries_aged_8_30_days__value
        description: "Measure of open_queries_aged_8_30_days."
        agg: sum
        expr: "CASE WHEN query_status IN ('open', 'answered') AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') >= 8 AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') <= 30 THEN 1 ELSE 0 END"
        agg_time_dimension: opened_date
      - name: open_queries_aged_31_60_days__value
        description: "Measure of open_queries_aged_31_60_days."
        agg: sum
        expr: "CASE WHEN query_status IN ('open', 'answered') AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') >= 31 AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') <= 60 THEN 1 ELSE 0 END"
        agg_time_dimension: opened_date
      - name: open_queries_aged_over_60_days__value
        description: "Measure of open_queries_aged_over_60_days."
        agg: sum
        expr: "CASE WHEN query_status IN ('open', 'answered') AND date_diff('day', CAST(strptime(CAST(opened_date_key AS VARCHAR), '%Y%m%d') AS DATE), DATE '2026-09-30') >= 61 THEN 1 ELSE 0 END"
        agg_time_dimension: opened_date
  - name: fct_spend
    description: "Budget against actual spend, with each quarter spread evenly over its three months. Grain: One row per study, vendor and calendar month."
    model: "ref('fct_spend')"
    defaults:
      agg_time_dimension: month_date
    entities:
      - name: fct_spend
        type: primary
        expr: "CAST(study_key AS VARCHAR) || '|' || CAST(vendor_key AS VARCHAR) || '|' || CAST(month_date_key AS VARCHAR)"
      - name: study
        type: foreign
        expr: study_key
      - name: vendor
        type: foreign
        expr: vendor_key
    dimensions:
      - name: month_date
        type: time
        expr: "CAST(strptime(CAST(month_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: budget_burn_vs_plan__numerator
        description: "The numerator of budget_burn_vs_plan."
        agg: sum
        expr: "CAST(actual_usd AS DOUBLE)"
        agg_time_dimension: month_date
      - name: budget_burn_vs_plan__denominator
        description: "The denominator of budget_burn_vs_plan."
        agg: sum
        expr: "CAST(budget_usd AS DOUBLE)"
        agg_time_dimension: month_date
      - name: cost_per_enrolled_subject__numerator
        description: "The numerator of cost_per_enrolled_subject."
        agg: sum
        expr: "CAST(actual_usd AS DOUBLE)"
        agg_time_dimension: month_date
      - name: actual_spend__value
        description: "Measure of actual_spend."
        agg: sum
        expr: "CAST(actual_usd AS DOUBLE)"
        agg_time_dimension: month_date
  - name: fct_spend_forecast
    description: "Budget, actual spend and forecast at completion per study and vendor at the data cut. The forecast is the actual spend to date plus the planned budget still to come, scaled by the vendor's spend-to-budget ratio to date. Grain: One row per study and vendor at the data cut."
    model: "ref('fct_spend_forecast')"
    defaults:
      agg_time_dimension: as_of_date
    entities:
      - name: fct_spend_forecast
        type: primary
        expr: "CAST(study_key AS VARCHAR) || '|' || CAST(vendor_key AS VARCHAR)"
      - name: study
        type: foreign
        expr: study_key
      - name: vendor
        type: foreign
        expr: vendor_key
    dimensions:
      - name: as_of_date
        type: time
        expr: "CAST(strptime(CAST(as_of_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: budget_at_completion__value
        description: "Measure of budget_at_completion."
        agg: sum
        expr: "CAST(budget_at_completion_usd AS DOUBLE)"
        agg_time_dimension: as_of_date
      - name: forecast_at_completion__value
        description: "Measure of forecast_at_completion."
        agg: sum
        expr: "CAST(forecast_at_completion_usd AS DOUBLE)"
        agg_time_dimension: as_of_date
      - name: variance_at_completion__value
        description: "Measure of variance_at_completion."
        agg: sum
        expr: "CAST(variance_at_completion_usd AS DOUBLE)"
        agg_time_dimension: as_of_date
      - name: forecast_vs_budget_at_completion__numerator
        description: "The numerator of forecast_vs_budget_at_completion."
        agg: sum
        expr: "CAST(forecast_at_completion_usd AS DOUBLE)"
        agg_time_dimension: as_of_date
      - name: forecast_vs_budget_at_completion__denominator
        description: "The denominator of forecast_vs_budget_at_completion."
        agg: sum
        expr: "CAST(budget_at_completion_usd AS DOUBLE)"
        agg_time_dimension: as_of_date
  - name: fct_visit
    description: "Subject visits against the schedule, with entry timeliness. Grain: One row per subject visit record."
    model: "ref('fct_visit')"
    defaults:
      agg_time_dimension: visit_date
    entities:
      - name: fct_visit
        type: primary
        expr: visit_id
      - name: study
        type: foreign
        expr: study_key
      - name: site
        type: foreign
        expr: site_key
      - name: country
        type: foreign
        expr: country_key
    dimensions:
      - name: visit_date
        type: time
        expr: "CAST(strptime(CAST(visit_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
      - name: planned_date
        type: time
        expr: "CAST(strptime(CAST(planned_date_key AS VARCHAR), '%Y%m%d') AS DATE)"
        type_params:
          time_granularity: day
    measures:
      - name: data_entry_lag_median__value
        description: "Measure of data_entry_lag_median."
        agg: median
        expr: "CASE WHEN entry_lag_days IS NOT NULL AND visit_date_key IS NOT NULL THEN CAST(entry_lag_days AS DOUBLE) END"
        agg_time_dimension: visit_date
      - name: data_entry_lag_p90__value
        description: "Measure of data_entry_lag_p90."
        agg: percentile
        expr: "CASE WHEN entry_lag_days IS NOT NULL AND visit_date_key IS NOT NULL THEN CAST(entry_lag_days AS DOUBLE) END"
        agg_params:
          percentile: 0.9
          use_discrete_percentile: false
        agg_time_dimension: visit_date
      - name: data_entry_lag_mean__value
        description: "Measure of data_entry_lag_mean."
        agg: average
        expr: "CASE WHEN entry_lag_days IS NOT NULL AND visit_date_key IS NOT NULL THEN CAST(entry_lag_days AS DOUBLE) END"
        agg_time_dimension: visit_date
      - name: missed_visit_rate__numerator
        description: "The numerator of missed_visit_rate."
        agg: sum
        expr: "CASE WHEN visit_status = 'missed' THEN 1 ELSE 0 END"
        agg_time_dimension: planned_date
      - name: missed_visit_rate__denominator
        description: "The denominator of missed_visit_rate."
        agg: sum
        expr: "1"
        agg_time_dimension: planned_date
      - name: out_of_window_visit_rate__numerator
        description: "The numerator of out_of_window_visit_rate."
        agg: sum
        expr: "CASE WHEN visit_date_key IS NOT NULL AND is_out_of_window = TRUE THEN 1 ELSE 0 END"
        agg_time_dimension: visit_date
      - name: out_of_window_visit_rate__denominator
        description: "The denominator of out_of_window_visit_rate."
        agg: sum
        expr: "CASE WHEN visit_date_key IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: visit_date
      - name: query_rate_per_100_visits__denominator
        description: "The denominator of query_rate_per_100_visits."
        agg: sum
        expr: "CASE WHEN visit_date_key IS NOT NULL THEN 1 ELSE 0 END"
        agg_time_dimension: visit_date
