# ODCS v3.2.0 data contract for silver.ctms_milestone. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/silver.ctms_milestone"
name: "Study milestones"
version: "1.0.0"
status: active
domain: CTMS
tags:
  - silver
  - internal
  - synthetic
description:
  purpose: "CTMS study milestones, planned and actual."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: ctms_milestone
    name: ctms_milestone
    physicalName: silver.ctms_milestone
    physicalType: table
    logicalType: object
    description: "CTMS study milestones, planned and actual."
    dataGranularityDescription: "One row per study and milestone kind."
    properties:
      - name: study_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Protocol id."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
      - name: milestone_kind
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Milestone kind."
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        classification: internal
      - name: milestone_label
        logicalType: string
        logicalTypeOptions:
          maxLength: 120
        physicalType: "VARCHAR(120)"
        description: "Label in the study's own vocabulary."
        required: true
        classification: internal
      - name: planned_on
        logicalType: date
        physicalType: DATE
        description: "Planned date."
        required: true
        classification: internal
      - name: actual_on
        logicalType: date
        physicalType: DATE
        description: "Actual date, or null when not reached."
        required: false
        classification: internal
      - name: source_system
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Source system the record came from."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: ctms_milestone_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - study_id
            - milestone_kind
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (study_id, milestone_kind) identifies one row."
team:
  name: CTMS
  members:
    - username: portfolio-management-lead
      name: "Portfolio Management Lead"
      role: owner
    - username: portfolio-data-steward
      name: "Portfolio Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 10
    unit: "y"
    driver: operational
    description: "Sponsor records policy for operational and derived data: a policy choice, not a regulatory minimum."
customProperties:
  - property: dataClassification
    value: internal
  - property: personalHealthData
    value: false
  - property: synthetic
    value: true
  - property: upstream
    value:
      - bronze.ctms.milestones
  - property: consumers
    value:
      - "product:gold.dim_milestone"
      - "product:gold.fct_milestone"
