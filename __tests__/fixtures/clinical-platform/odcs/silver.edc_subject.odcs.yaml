# ODCS v3.2.0 data contract for silver.edc_subject. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/silver.edc_subject"
name: "EDC subjects"
version: "1.1.0"
status: active
domain: EDC
tags:
  - silver
  - confidential
  - personal-health-data
  - synthetic
description:
  purpose: "EDC subjects with their screening, enrollment and disposition dates."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: edc_subject
    name: edc_subject
    physicalName: silver.edc_subject
    physicalType: table
    logicalType: object
    description: "EDC subjects with their screening, enrollment and disposition dates."
    dataGranularityDescription: "One row per subject."
    properties:
      - name: subject_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Subject id, unique within the portfolio."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: confidential
      - name: study_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Protocol id."
        required: true
        classification: internal
      - name: site_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Site id."
        required: true
        classification: internal
      - name: screened_on
        logicalType: date
        physicalType: DATE
        description: "Date of the screening visit."
        required: true
        classification: confidential
      - name: enrolled_on
        logicalType: date
        physicalType: DATE
        description: "Enrollment date, or null when not enrolled."
        required: false
        classification: confidential
      - name: completed_on
        logicalType: date
        physicalType: DATE
        description: "Date the subject completed the study."
        required: false
        classification: confidential
      - name: discontinued_on
        logicalType: date
        physicalType: DATE
        description: "Date the subject discontinued."
        required: false
        classification: confidential
      - name: subject_status
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Status at the data cut."
        required: true
        classification: internal
      - name: screen_failure_reason
        logicalType: string
        logicalTypeOptions:
          maxLength: 40
        physicalType: "VARCHAR(40)"
        description: "Why screening failed, from a short fictional controlled list; null unless the subject failed screening."
        required: false
        classification: internal
      - name: source_system
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Source system the record came from."
        required: true
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: edc_subject_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - subject_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (subject_id) identifies one row."
team:
  name: EDC
  members:
    - username: clinical-data-management-lead
      name: "Clinical Data Management Lead"
      role: owner
    - username: clinical-data-steward
      name: "Clinical Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 25
    unit: "y"
    driver: regulatory
    description: "Regulation (EU) No 536/2014, Article 58: the trial master file is archived for at least 25 years after the end of the trial."
customProperties:
  - property: dataClassification
    value: confidential
  - property: personalHealthData
    value: true
  - property: synthetic
    value: true
  - property: upstream
    value:
      - bronze.edc.subjects
  - property: consumers
    value:
      - "product:gold.dim_site"
      - "product:gold.fct_enrollment"
      - "product:gold.fct_visit"
      - "product:gold.fct_kri_snapshot"
