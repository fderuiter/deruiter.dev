# ODCS v3.2.0 data contract for gold.fct_monitoring_visit. Synthetic data for demonstration. Every study, site, subject and vendor is fictional.
apiVersion: v3.2.0
kind: DataContract
id: "clinical-platform/gold.fct_monitoring_visit"
name: "Monitoring visit facts"
version: "1.1.0"
status: active
domain: "Operations mart"
tags:
  - gold
  - internal
  - synthetic
description:
  purpose: "Monitoring visits with source data verification and report timeliness."
  limitations: "Synthetic data for demonstration. Every study, site, subject and vendor is fictional."
schema:
  - id: fct_monitoring_visit
    name: fct_monitoring_visit
    physicalName: gold.fct_monitoring_visit
    physicalType: table
    logicalType: object
    description: "Monitoring visits with source data verification and report timeliness."
    dataGranularityDescription: "One row per monitoring visit."
    properties:
      - name: monitoring_visit_id
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "Monitoring visit id (degenerate dimension)."
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: internal
      - name: study_key
        logicalType: integer
        physicalType: INTEGER
        description: Study.
        required: true
        classification: internal
      - name: site_key
        logicalType: integer
        physicalType: INTEGER
        description: "Site version in force on the visit date."
        required: true
        classification: internal
      - name: country_key
        logicalType: integer
        physicalType: INTEGER
        description: "Country of the site."
        required: true
        classification: internal
      - name: visit_date_key
        logicalType: integer
        physicalType: INTEGER
        description: "Visit date."
        required: true
        classification: internal
      - name: report_final_date_key
        logicalType: integer
        physicalType: INTEGER
        description: "Date the report was finalised."
        required: false
        classification: internal
      - name: monitoring_plan_key
        logicalType: integer
        physicalType: INTEGER
        description: "Monitoring plan in force on the visit date."
        required: true
        classification: internal
      - name: report_due_date_key
        logicalType: integer
        physicalType: INTEGER
        description: "Date the report is due: the visit date plus the plan's report deadline."
        required: true
        classification: internal
      - name: visit_type
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "SIV, IMV or COV."
        required: true
        classification: internal
      - name: visit_mode
        logicalType: string
        logicalTypeOptions:
          maxLength: 64
        physicalType: "VARCHAR(64)"
        description: "On-site or remote."
        required: true
        classification: internal
      - name: sdv_pages_due
        logicalType: integer
        physicalType: INTEGER
        description: "CRF pages due for source data verification."
        required: true
        classification: internal
      - name: sdv_pages_verified
        logicalType: integer
        physicalType: INTEGER
        description: "CRF pages source-verified."
        required: true
        classification: internal
      - name: action_items
        logicalType: integer
        physicalType: INTEGER
        description: "Action items raised."
        required: true
        classification: internal
      - name: days_to_final_report
        logicalType: integer
        physicalType: INTEGER
        description: "Days from the visit to the final report."
        required: false
        classification: internal
      - name: is_synthetic
        logicalType: boolean
        physicalType: BOOLEAN
        description: "Always true: the row describes synthetic data, nothing real."
        required: true
        classification: public
    quality:
      - id: fct_monitoring_visit_primary_key
        type: library
        metric: duplicateValues
        arguments:
          properties:
            - monitoring_visit_id
        mustBe: 0
        dimension: uniqueness
        description: "The primary key (monitoring_visit_id) identifies one row."
team:
  name: "Operations mart"
  members:
    - username: clinical-monitoring-lead
      name: "Clinical Monitoring Lead"
      role: owner
    - username: clinical-operations-data-steward
      name: "Clinical Operations Data Steward"
      role: "data steward"
slaProperties:
  - id: latency
    property: latency
    value: 24
    unit: h
    driver: operational
    description: "The latest load is at most 24 hours old when the data is read."
  - id: completeness
    property: completeness
    value: 100
    unit: percent
    driver: operational
    description: "Share of the values of required properties that are present."
  - id: availability
    property: availability
    value: 99.5
    unit: percent
    driver: operational
    description: "Share of time the product can be read."
  - id: retention
    property: retention
    value: 10
    unit: "y"
    driver: operational
    description: "Sponsor records policy for operational and derived data: a policy choice, not a regulatory minimum."
customProperties:
  - property: dataClassification
    value: internal
  - property: personalHealthData
    value: false
  - property: synthetic
    value: true
  - property: upstream
    value:
      - gold.dim_country
      - gold.dim_monitoring_plan
      - gold.dim_site
      - gold.dim_study
      - silver.ctms_monitoring_plan
      - silver.ctms_monitoring_visit
      - silver.site
  - property: consumers
    value:
      - "metric:sdv_completion"
      - "metric:monitoring_reports_overdue"
      - "metric:monitoring_report_cycle_time_median"
